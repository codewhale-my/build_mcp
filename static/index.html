if(localBtn)localBtn.onclick=localBtnClick;
if(localUp)localUp.onchange=e=>{uploadFiles([...e.target.files]);e.target.value=''};

/* =============== 模型选择(回答用哪个模型, 逐轮生效) =============== */
const MODEL_KEY='hj_mcp_model';
const modelBtn=$('#modelBtn'), modelMenu=$('#modelMenu');
let modelList=[], modelDefault='', modelKey='';
function modelLabel(key){
  const it=modelList.find(m=>m.key===key);
  return it?it.label:(key||'');
}
function renderModelBtn(){
  if(!modelBtn)return;
  modelBtn.hidden=false;
  const cur=modelList.find(m=>m.key===modelKey);
  const txt=$('#modelTxt');
  if(txt)txt.textContent=cur?cur.label:(modelList.length?'模型':'模型');
  modelBtn.title=cur
    ? ('当前模型：'+cur.label+(cur.thinking?'（思考模式）':'')+'　点击切换')
    : '选择回答模型';
}
function openModelMenu(){
  if(!modelMenu)return;
  if(!modelList.length){
    modelMenu.innerHTML='<div class="ws-hd"><span>回答模型</span></div>'+
      '<div style="padding:8px 10px;font-size:12px;color:var(--text3)">模型列表未加载</div>';
    modelMenu.hidden=false;return;
  }
  let html='<div class="ws-hd"><span>选择回答模型</span><span>'+(modelKey===modelDefault?'默认':'')+'</span></div>';
  modelList.forEach(m=>{
    const isCur=m.key===modelKey;
    html+='<button class="ws-item" data-key="'+esc(m.key)+'">'+
      '<span class="wi-ico">'+(m.thinking?'🧠':'⚡')+'</span>'+
      '<span class="wi-name">'+esc(m.label)+'</span>'+
      '<span class="wi-tag">'+(m.thinking?'思考':'快答')+'</span>'+
      (isCur?'<span class="wi-check">✓</span>':'')+
    '</button>';
  });
  modelMenu.innerHTML=html;
  modelMenu.querySelectorAll('.ws-item').forEach(btn=>{
    btn.onclick=()=>{setModel(btn.dataset.key);closeModelMenu()};
  });
  modelMenu.hidden=false;
}
function closeModelMenu(){
  if(modelMenu)modelMenu.hidden=true;
  if(modelBtn)modelBtn.classList.remove('open');
}
function toggleModelMenu(){
  if(!modelMenu)return;
  if(!modelMenu.hidden){closeModelMenu();return}
  openModelMenu();
  if(modelBtn)modelBtn.classList.add('open');
}
function setModel(key){
  if(!key)return;
  modelKey=key;
  try{localStorage.setItem(MODEL_KEY,key)}catch(e){}
  renderModelBtn();
}
async function loadModels(){
  try{
    const r=await fetch('/api/models',{headers:{'Authorization':'Bearer '+authToken}});
    if(!r.ok)return;
    const d=await r.json();
    modelList=Array.isArray(d.models)?d.models:[];
    modelDefault=d.default||((modelList[0]&&modelList[0].key)||'');
    let saved='';
    try{saved=localStorage.getItem(MODEL_KEY)||''}catch(e){}
    modelKey=modelList.some(m=>m.key===saved)?saved:modelDefault;
    renderModelBtn();
  }catch(e){/* 拉不到就用默认, 不影响对话 */}
}
if(modelBtn)modelBtn.onclick=toggleModelMenu;
document.addEventListener('click',e=>{
  if(!modelMenu||modelMenu.hidden)return;
  const anchor=modelBtn&&modelBtn.parentElement;
  if(anchor&&!anchor.contains(e.target))closeModelMenu();
});
/* =============== 模型选择 end =============== */

/* =============== 精确定位(浏览器 Geolocation, 优先级高于 IP 定位) =============== */
const GEO_PREF='hj_mcp_geo_on';          // 只记"用户是否想开启"，坐标永不落盘
let geoEnabled=false, geoFix=null, geoBusy=false;
try{geoEnabled=localStorage.getItem(GEO_PREF)==='1'}catch(e){}
const geoBtn=$('#geoBtn'), geoTxt=$('#geoTxt');
function geoSupported(){return !!(navigator&&navigator.geolocation)}
function geoSecure(){
  // 浏览器只在安全上下文暴露定位：https 或 localhost
  return !!window.isSecureContext||location.hostname==='localhost'||location.hostname==='127.0.0.1';
}
function geoRender(){
  if(!geoBtn)return;
  geoBtn.hidden=false;
  if(geoBusy){geoBtn.className='lbtn gbtn busy';geoTxt.textContent='定位中…';geoBtn.title='正在获取定位…';return}
  if(!geoSupported()){
    geoBtn.className='lbtn gbtn err';geoTxt.textContent='定位不可用';
    geoBtn.title='当前浏览器不支持定位';
  }else if(!geoSecure()){
    geoBtn.className='lbtn gbtn err';geoTxt.textContent='定位需HTTPS';
    geoBtn.title='浏览器要求 HTTPS 才允许精确定位；当前是 http 访问，暂时沿用 IP 定位（城市级）。配好域名+HTTPS 后即可开启。';
  }else if(geoEnabled&&geoFix){
    geoBtn.className='lbtn gbtn on';geoTxt.textContent='定位已开启';
    geoBtn.title='已获取定位（精度约 ±'+Math.round(geoFix.acc||0)+' 米），点击关闭';
  }else if(geoEnabled){
    geoBtn.className='lbtn gbtn';geoTxt.textContent='定位未就绪';
    geoBtn.title='已开启精确定位，但暂时没拿到坐标（信号弱/超时）。点一下可重试，发消息时也会自动重试。';
  }else{
    geoBtn.className='lbtn gbtn';geoTxt.textContent='开启定位';
    geoBtn.title='点击开启精确定位（浏览器会询问授权）。问“我在哪 / 附近 / 怎么走 / 天气”这类问题时，也会自动尝试开启。';
  }
}
function geoErrHint(err){
  const c=err&&err.code;
  if(c===1)return '定位权限被拒绝，可在浏览器地址栏的权限设置里重新允许';
  if(c===2)return '暂时拿不到定位（信号弱），继续使用 IP 定位';
  if(c===3)return '定位超时，继续使用 IP 定位';
  return '定位失败：'+((err&&err.message)||'未知原因');
}
let geoPending=null;   // 并发合并：同一时刻只跑一次定位，避免重复弹权限
function requestGeo(silent){
  if(geoPending)return geoPending;
  const p=new Promise(resolve=>{
    if(!geoSupported()||!geoSecure()){resolve(null);return}
    geoBusy=true;geoRender();
    navigator.geolocation.getCurrentPosition(pos=>{
      geoBusy=false;
      const c=pos.coords||{};
      geoFix={lat:c.latitude,lng:c.longitude,acc:c.accuracy,ts:Date.now()};
      geoRender();
      if(!silent)toast('定位已开启（精度约 ±'+Math.round(c.accuracy||0)+' 米）');
      resolve(geoFix);
    },err=>{
      geoBusy=false;geoFix=null;
      if(err&&err.code===1){geoEnabled=false;try{localStorage.removeItem(GEO_PREF)}catch(e){}}
      geoRender();
      if(!silent)toast(geoErrHint(err));
      resolve(null);
    },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
  });
  geoPending=p;
  p.then(()=>{geoPending=null},()=>{geoPending=null});
  return p;
}
// —— 位置意图识别：命中则发送前自动尝试开启精确定位 ——
const GEO_INTENT_RE=new RegExp([
  '我在(哪|什么位置|什么地方|哪个位置)','我的位置','当前位置','我这边(在哪|什么位置)','现在在哪',
  '附近','周边','周围','就近','最近的','离我(多|有)远','距离我',
  '怎么(走|去|到)','导航','路线','带我去','怎么过去','怎么到达',
  '离.{0,10}(多远|几点几公里|多少公里)','几公里','车程','打车','步行','骑行','坐地铁','公交',
  '(去哪|哪里|哪儿)(吃|玩|逛|买)','去哪儿',
  '(推荐|找个|找一家|帮我找|有没有|哪家).{0,10}(餐厅|饭店|吃的|美食|咖啡|奶茶|酒店|宾馆|民宿|超市|商场|便利店|医院|药店|银行|ATM|加油站|充电桩|停车场|厕所|洗手间|景点|公园|地铁站|健身房|快递|菜市场)',
  '(找一家|找个|推荐个|推荐一家|来一家|哪家好|去哪家).{0,6}(店|馆|城|铺|吧|站|场|园|楼)',
  '天气|气温|降雨|下雨|下雪|空气质量|雾霾|紫外线|穿什么|限行',
  '\\bnear ?me\\b','nearby','\\baround me\\b','where am i','directions to','how far','\\bhow do i get\\b','closest','nearest'
].join('|'),'i');
function needsGeoLocation(q){
  if(!q)return false;
  return GEO_INTENT_RE.test(q);
}
function geoBtnClick(){
  if(geoBusy)return;
  if(!geoSupported()){toast('当前浏览器不支持定位');return}
  if(!geoSecure()){
    toast('浏览器只在 HTTPS 下允许精确定位；当前是 http 访问，先用 IP 定位，配好域名+HTTPS 后即可开启');
    return;
  }
  if(geoEnabled&&geoFix){   // 已就绪 → 这次点击用来关闭
    geoEnabled=false;geoFix=null;
    try{localStorage.removeItem(GEO_PREF)}catch(e){}
    geoRender();toast('已关闭精确定位，改回 IP 定位');
    return;
  }
  geoEnabled=true;          // 未开启 / 已开启但没坐标 → 开启并取一次
  try{localStorage.setItem(GEO_PREF,'1')}catch(e){}
  requestGeo(false);
}
async function geoForSend(force){
  // 发送时取一份尽量新鲜的坐标。
  // force=true（问题与位置相关）→ 即使没开定位也自动尝试开启；最多等几秒，绝不卡死发送。
  if(!geoSupported())return null;
  if(!geoSecure()){
    if(force)toast('当前不是 HTTPS，浏览器不允许精确定位，本次改用 IP 定位（城市级）');
    return null;
  }
  let perm='unknown';
  try{
    const st=await navigator.permissions.query({name:'geolocation'});
    perm=st.state||'unknown';
  }catch(e){/* 个别浏览器不支持 permissions.query */}
  const autoOn=force&&!geoEnabled;
  if(autoOn){
    geoEnabled=true;                       // 位置相关的问题 → 直接开启
    try{localStorage.setItem(GEO_PREF,'1')}catch(e){}
    geoRender();
    toast(perm==='prompt'?'这条问题需要位置信息，请在浏览器提示里点「允许」…':'这条问题需要位置信息，正在获取精确定位…');
  }else if(!geoEnabled){
    return null;
  }
  if(geoFix&&Date.now()-(geoFix.ts||0)<180000)return geoFix;
  // 首次授权要等用户点浏览器弹窗，给足时间；已授权则很快
  const wait=force?(perm==='prompt'?15000:(perm==='denied'?1200:7000)):3000;
  await Promise.race([requestGeo(true),sleep(wait)]);
  if(force){
    if(geoFix&&autoOn)toast('已获取精确定位（精度约 ±'+Math.round(geoFix.acc||0)+' 米）');
    else if(!geoFix)toast(perm==='denied'
      ?'定位权限被拒绝，本次改用 IP 定位（城市级）；可在浏览器地址栏重新允许'
      :'没拿到精确定位，本次改用 IP 定位（城市级）');
  }
  return geoFix;
}
if(geoBtn)geoBtn.onclick=geoBtnClick;
geoRender();
/* =============== 精确定位 end =============== */

/* =============== 更新说明(What's New) =============== */
// 数据源与"是否已读"都在服务端：/api/whatsnew 返回 unseen（没看过的新版本）+ entries（全部）。
// 看过与否按用户维度记在 users.last_seen_version，换设备/清缓存都不会重复弹。
let updData=null;
const updOverlay=$('#updOverlay'), updBody=$('#updBody'), updOkBtn=$('#updOk'),
      updDot=$('#updDot'), updHeadTitle=$('#updHeadTitle'), updHeadSub=$('#updHeadSub'),
      updTip=$('#updTip'), updBtn=$('#updBtn');
function updEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function updItemHtml(e){
  const pts=(e.points||[]).map(p=>'<li>'+updEsc(p)+'</li>').join('');
  return '<div class="upd-item">'
    +'<div class="upd-meta"><span class="upd-ver">'+updEsc(e.version)+'</span>'
    +(e.date?'<span class="upd-date">'+updEsc(e.date)+'</span>':'')+'</div>'
    +(e.title?'<div class="upd-title">'+updEsc(e.title)+'</div>':'')
    +(pts?'<ul>'+pts+'</ul>':'')
    +'</div>';
}
async function loadWhatsNew(auto){
  if(!authToken)return null;
  try{
    const r=await fetch('/api/whatsnew',{headers:{'Authorization':'Bearer '+authToken}});
    if(!r.ok)return null;
    updData=await r.json();
  }catch(e){return null}
  const hasNew=!!(updData&&updData.should_show);
  if(updDot)updDot.hidden=!hasNew;
  if(auto&&hasNew)showWhatsNew('unseen');   // 登录后自动弹
  return updData;
}
function showWhatsNew(mode){
  if(!updOverlay||!updData)return;
  const list=(mode==='all')?(updData.entries||[]):(updData.unseen||[]);
  if(!list.length)return;
  updHeadTitle.textContent=(mode==='all')?'更新日志':('版本更新 · '+list[0].version);
  updHeadSub.textContent=(mode==='all')
    ?('共 '+list.length+' 个版本，最新 '+updData.latest)
    :'本次更新内容如下';
  updTip.textContent=(mode==='all')?'':'关闭后不再重复提醒';
  updBody.innerHTML=list.map(updItemHtml).join('');
  updOverlay.hidden=false;
  updBody.scrollTop=0;
}
async function closeWhatsNew(){
  if(updOverlay)updOverlay.hidden=true;
  const unseen=(updData&&updData.unseen)||[];
  const latest=(updData&&updData.latest)||'';
  if(updDot)updDot.hidden=true;
  if(!unseen.length)return;              // 只是翻看历史，无需上报
  if(updData){updData.should_show=false;updData.unseen=[]}
  try{
    await fetch('/api/whatsnew/seen',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
      body:JSON.stringify({version:latest})
    });
  }catch(e){/* 上报失败也无所谓，下次登录再弹一次而已 */}
}
if(updOkBtn)updOkBtn.onclick=()=>closeWhatsNew();
if(updOverlay)updOverlay.addEventListener('click',e=>{if(e.target===updOverlay)closeWhatsNew()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&updOverlay&&!updOverlay.hidden)closeWhatsNew();
});
if(updBtn)updBtn.onclick=async()=>{
  if(!updData)await loadWhatsNew(false);
  if(!updData||!(updData.entries||[]).length){toast('暂时没有更新内容');return}
  showWhatsNew((updData.unseen||[]).length?'unseen':'all');   // 有未读先看未读，否则翻全部
};
/* =============== 更新说明 end =============== */

(async function initAuth(){
  if(!authToken){showAuth();return}
  try{
    const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+authToken}});
    if(r.ok){
      const d=await r.json();
      applyMe(d);          // 统一填充，勿在此另写一份（曾因此漏掉 isAdmin）
      hideAuth();
      await loadServerHistory();   // 历史按登录用户加载，互不可见
      await loadModels();          // 可选模型清单
      localStatus();wsStart();await restoreLocalHandle();geoRender();
      loadWhatsNew(true);               // 有未读更新 → 登录后自动弹一次
      if(geoEnabled)requestGeo(true);   // 上次开过 → 静默刷新一次坐标
      inputBox.focus();
      return;
    }
  }catch(e){/* 网络错误走下方统一登出 */}
  authToken='';
  try{localStorage.removeItem(TOKEN_KEY)}catch(e){}
  showAuth('登录已过期，请重新登录');
})();
