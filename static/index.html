<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HJ_MCP Agent🐋 · 全能助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<script>
// 主题：localStorage 优先，其次跟随系统；提前执行防止闪烁
(function(){
  try{
    var t = localStorage.getItem('mcp-theme');
    if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
:root{
  --radius:16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Courier New", monospace;
}
/* ============ 深色主题 ============ */
html[data-theme="dark"]{
  --bg0:#07090f; --bg1:#0d1017;
  --panel:rgba(255,255,255,.042);
  --panel-solid:#151926;
  --border:rgba(255,255,255,.085);
  --border-strong:rgba(255,255,255,.16);
  --text:#e9ebf3; --text2:#99a1b3; --text3:#5f677e;
  --accent1:#4c7dff; --accent2:#9a6bff;
  --user-grad:linear-gradient(135deg,#3d6dff,#8b5cf6);
  --bubble:rgba(255,255,255,.045);
  --code-bg:#0a0d14;
  --code-head:#0d1119;
  --err-bg:rgba(255,80,110,.09); --err-bd:rgba(255,90,120,.45); --err-tx:#ff8fa3;
  --glow:rgba(76,125,255,.16);
  --shadow:0 12px 34px rgba(0,0,0,.38);
  color-scheme:dark;
}
/* ============ 浅色主题 ============ */
html[data-theme="light"]{
  --bg0:#eef1f8; --bg1:#f6f7fc;
  --panel:#ffffff;
  --panel-solid:#ffffff;
  --border:#e2e6f0;
  --border-strong:#cdd4e4;
  --text:#191e2c; --text2:#5b6474; --text3:#8b93a5;
  --accent1:#2f6bff; --accent2:#7c4dff;
  --user-grad:linear-gradient(135deg,#2f6bff,#7c4dff);
  --bubble:#ffffff;
  --code-bg:#f3f5fb;
  --code-head:#eceff8;
  --err-bg:#fff0f2; --err-bd:#ffc2cc; --err-tx:#d33855;
  --glow:rgba(47,107,255,.10);
  --shadow:0 12px 30px rgba(30,42,80,.10);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg1);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* 背景氛围光斑 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(600px 400px at 12% -10%, var(--glow), transparent 60%),
    radial-gradient(700px 500px at 105% 8%, var(--glow), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, var(--glow), transparent 60%);
}
.app{
  position:relative;z-index:1;height:100dvh;max-width:880px;margin:0 auto;
  display:flex;flex-direction:column;padding:0 18px;
}
/* ============ 顶栏 ============ */
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 2px 12px;flex:none;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(76,125,255,.35);
}
.logo svg{width:20px;height:20px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--text2);margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tool-chip{
  font-size:11px;color:var(--text2);padding:2px 8px;border-radius:99px;
  background:var(--panel);border:1px solid var(--border);white-space:nowrap;
}
.hbtns{display:flex;gap:6px;flex:none}
.hbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:.18s;
}
.hbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--panel-solid)}
.hbtn svg{width:17px;height:17px}
/* 本机文件授权按钮(桌面 Chrome/Edge 目录授权, 其余浏览器降级上传) */
.lbtn{
  display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 11px;border-radius:9px;
  font-size:12.5px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--border);background:var(--panel-solid);color:var(--text2);
  transition:border-color .15s,color .15s;
}
.lbtn:hover{color:var(--text);border-color:var(--border-strong)}
.lbtn .dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex:none}
.lbtn.on{border-color:color-mix(in srgb,var(--accent1) 45%,var(--border));color:var(--accent1)}
.lbtn.on .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.lbtn .txt{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.lbtn.err .dot{background:var(--err-tx)}
/* 输入框上方的工作空间条 */
.wsbar{
  display:flex;align-items:center;justify-content:flex-start;gap:8px;
  padding:2px 2px 8px;flex:none;
}
.wsbar[hidden]{display:none}
.ws-anchor{position:relative;display:inline-flex}
/* 模型选择按钮(与工作空间按钮同款外观, 位于其右侧) */
.m-anchor{position:relative;display:inline-flex}
.mbtn .txt{max-width:150px}
.mbtn .dot{background:var(--accent1);opacity:.85}
.ws-item .wi-tag{
  flex:none;font-size:10.5px;padding:1px 6px;border-radius:6px;
  background:var(--panel);color:var(--text3);border:1px solid var(--border);
}
.ws-item .wi-check{flex:none;color:var(--accent1);font-weight:700}
/* 回答下方的小字：本轮由哪个模型回答 */
.msg-model{font-size:11px;color:var(--text3);margin-top:5px;opacity:.9}
.msg-model .mm-dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent1);
  margin-right:5px;vertical-align:middle;opacity:.8;
}
.lbtn .chev{width:11px;height:11px;flex:none;opacity:.7;transition:transform .18s}
.lbtn.open .chev{transform:rotate(180deg)}
.ws-menu{
  position:absolute;left:0;bottom:calc(100% + 8px);z-index:60;min-width:230px;max-width:320px;
  max-height:min(58vh,400px);overflow-y:auto;
  background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:13px;
  box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;
  animation:pop .16s ease;transform-origin:bottom left;
}
.ws-menu[hidden]{display:none}
.ws-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:11px;color:var(--text3);padding:5px 10px 6px;
}
.ws-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border-radius:9px;border:none;background:none;cursor:pointer;
  font-family:var(--font);font-size:13px;color:var(--text);transition:background .12s;
}
.ws-item:hover{background:var(--panel)}
.ws-item .wi-ico{flex:none;font-size:14px}
.ws-item .wi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-item .wi-now{flex:none;font-size:11px;color:var(--accent1)}
.ws-item .wi-del{flex:none;font-size:12px;color:var(--text3);padding:2px 6px;border-radius:6px}
.ws-item .wi-del:hover{color:var(--err-tx);background:var(--err-bg)}
.ws-sep{height:1px;background:var(--border);margin:4px 6px}
.ws-add{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border-radius:9px;border:none;background:none;cursor:pointer;
  font-family:var(--font);font-size:13px;color:var(--accent1);transition:background .12s;
}
.ws-add:hover{background:var(--panel)}
/* 当前登录用户徽标 */
.user-badge{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
  border-radius:999px;border:1px solid var(--border);background:var(--panel);
  font-size:12.5px;color:var(--text2);max-width:150px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.user-badge::before{content:"👤";font-size:12px;flex:none}
.user-badge[hidden]{display:none}
@media (max-width:600px){.user-badge{max-width:92px;padding:0 10px;font-size:11.5px;height:31px}}
/* ============ 消息区 ============ */
/* 隐藏原生滚动条（长度由浏览器控制，无法自定义），改用自绘"米粒"指示条 */
#chatBox{
  flex:1;overflow-y:auto;padding:20px 10px 12px 2px;scroll-behavior:smooth;
  scrollbar-width:none; /* Firefox 隐藏 */
}
#chatBox::-webkit-scrollbar{display:none}
/* 自绘滚动指示条：固定高度的小短条，滚动时出现，停止后淡出 */
.chat-scroll-ind{
  position:absolute;right:4px;top:80px;width:4px;height:20px;border-radius:4px;
  background:var(--text3);opacity:0;transition:opacity .4s;pointer-events:none;z-index:5;
}
.chat-scroll-ind.show{opacity:.75}
.msg{display:flex;gap:11px;margin-bottom:22px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  width:32px;height:32px;flex:none;border-radius:10px;margin-top:2px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(76,125,255,.3);
}
.avatar svg{width:15px;height:15px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg.user .col{align-items:flex-end}
.time{font-size:11px;color:var(--text3);margin:0 4px 5px}
.bubble{
  max-width:100%;padding:12px 15px;border-radius:var(--radius);
  line-height:1.75;font-size:14.5px;word-break:break-word;overflow-wrap:break-word;
}
.bot .bubble{
  background:var(--bubble);border:1px solid var(--border);
  border-top-left-radius:5px;width:100%;
  box-shadow:var(--shadow);
}
.user .bubble{
  background:var(--user-grad);color:#fff;
  border-top-right-radius:5px;
  box-shadow:0 8px 20px rgba(76,125,255,.25);
  white-space:pre-wrap;
}
/* ---------- 气泡内 Markdown 排版 ---------- */
.bubble p{margin:0 0 10px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{
  margin:16px 0 8px;line-height:1.4;font-weight:700;
}
.bubble h1{font-size:19px}.bubble h2{font-size:17px}
.bubble h3{font-size:15.5px}.bubble h4{font-size:14.5px}
.bubble ul,.bubble ol{margin:4px 0 10px;padding-left:22px}
.bubble li{margin:3px 0}
.bubble a{color:var(--accent1);text-decoration:none;border-bottom:1px dashed var(--border-strong)}
/* 工作空间文件下载卡片（点击保存到本机/手机） */
.bubble a.filedl{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px 6px 6px;margin:2px 4px;border-radius:10px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel-solid),color-mix(in srgb,var(--panel-solid) 88%,var(--accent1) 12%));
  color:var(--text);font-size:13px;font-weight:500;text-decoration:none;vertical-align:baseline;
  box-shadow:0 1px 4px rgba(0,0,0,.07);transition:border-color .15s,transform .12s,box-shadow .15s;
}
.bubble a.filedl:hover{
  border-color:var(--accent1);transform:translateY(-1px);
  box-shadow:0 3px 10px rgba(76,125,255,.18);
}
/* 左侧文件类型徽标：按扩展名渐变着色 */
.bubble a.filedl .f-ico{
  width:26px;height:26px;border-radius:7px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;letter-spacing:.4px;color:#fff;
  background:linear-gradient(135deg,#4c7dff,#9a6bff);
}
.bubble a.filedl.ext-md .f-ico,.bubble a.filedl.ext-markdown .f-ico{background:linear-gradient(135deg,#4c7dff,#38bdf8)}
.bubble a.filedl.ext-txt .f-ico,.bubble a.filedl.ext-log .f-ico{background:linear-gradient(135deg,#64748b,#94a3b8)}
.bubble a.filedl.ext-pdf .f-ico{background:linear-gradient(135deg,#ef4444,#f97316)}
.bubble a.filedl.ext-doc .f-ico,.bubble a.filedl.ext-docx .f-ico{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.bubble a.filedl.ext-xls .f-ico,.bubble a.filedl.ext-xlsx .f-ico,.bubble a.filedl.ext-csv .f-ico{background:linear-gradient(135deg,#059669,#34d399)}
.bubble a.filedl.ext-ppt .f-ico,.bubble a.filedl.ext-pptx .f-ico{background:linear-gradient(135deg,#ea580c,#fb923c)}
.bubble a.filedl.ext-zip .f-ico,.bubble a.filedl.ext-tar .f-ico,.bubble a.filedl.ext-gz .f-ico{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.bubble a.filedl.ext-py .f-ico,.bubble a.filedl.ext-js .f-ico,.bubble a.filedl.ext-ts .f-ico,.bubble a.filedl.ext-json .f-ico,.bubble a.filedl.ext-sh .f-ico{background:linear-gradient(135deg,#0d9488,#2dd4bf)}
/* 文件名过长省略 */
.bubble a.filedl .f-name{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 右侧下载箭头：hover 时高亮 */
.bubble a.filedl .f-dl{
  width:20px;height:20px;border-radius:50%;flex:none;margin-left:2px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--accent1);background:transparent;
  border:1px solid transparent;transition:all .15s;
}
.bubble a.filedl:hover .f-dl{
  background:color-mix(in srgb,var(--accent1) 14%,transparent);
  border-color:color-mix(in srgb,var(--accent1) 35%,transparent);
}
.bubble a:hover{opacity:.85}
.bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.bubble blockquote{
  margin:10px 0;padding:4px 14px;border-left:3px solid var(--accent1);
  background:var(--panel);border-radius:0 8px 8px 0;color:var(--text2);
}
.bubble code{
  font-family:var(--mono);font-size:12.8px;background:var(--code-bg);
  border:1px solid var(--border);padding:1.5px 6px;border-radius:6px;
}
.bubble pre{
  margin:10px 0;padding:12px 14px;border-radius:12px;overflow:auto;
  background:var(--code-bg);border:1px solid var(--border);
}
.bubble pre code{background:none;border:none;padding:0;font-size:12.8px;line-height:1.6;display:block}
.bubble pre::-webkit-scrollbar{height:7px}
.bubble pre::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
/* ---------- 错误气泡 ---------- */
.bubble.err{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-tx)}
/* ---------- 思考动画 ---------- */
.typing{display:flex;align-items:center;gap:10px}
.dots{display:inline-flex;gap:4px;padding:2px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.stop-btn{
  margin-left:auto;flex:none;font-size:12px;color:var(--text2);cursor:pointer;
  border:1px solid var(--border);background:var(--panel);border-radius:8px;
  padding:3px 9px;transition:.15s;display:flex;align-items:center;gap:4px;
}
.stop-btn:hover{color:var(--err-tx);border-color:var(--err-bd)}
/* ---------- 流式消息：头部行/停止按钮/工具徽章 ---------- */
.live-top{display:flex;align-items:center;width:100%;margin:0 0 2px}
.live-top .time{margin:0}
.stop-mini{
  margin-left:auto;flex:none;font-size:11px;color:var(--text2);cursor:pointer;
  border:1px solid var(--border);background:var(--panel);border-radius:8px;
  padding:2px 8px;transition:.15s;display:flex;align-items:center;gap:3px;
}
.stop-mini:hover{color:var(--err-tx);border-color:var(--err-bd)}
.bubble.live{color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.6}
/* 流式正文中穿插的工具动作行：紧跟所在段落，浅色小字 */
.live-act{
  display:flex;align-items:center;gap:8px;
  margin:10px 0 12px;padding:2px 0;
  font-size:12.4px;line-height:1.45;color:var(--text2);
  user-select:none;
}
.live-act .a-ico{
  flex:none;width:15px;height:15px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;
}
.live-act.run .a-ico{background:var(--accent1);animation:a-pulse 1.1s ease-in-out infinite}
.live-act.done{opacity:.55}
.live-act.done .a-ico{background:#16a34a}
.live-act.fail{opacity:.7}
.live-act.fail .a-ico{background:var(--err-tx)}
.live-act .a-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes a-pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* ============ 欢迎页 ============ */
.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px 6vh}
.welcome .wlogo{
  width:64px;height:64px;border-radius:20px;margin-bottom:20px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 40px rgba(76,125,255,.35);
}
.welcome .wlogo svg{width:30px;height:30px}
.welcome h2{font-size:22px;font-weight:700;margin-bottom:8px}
.welcome p{color:var(--text2);font-size:14px;max-width:460px;line-height:1.7}
.suggests{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;width:100%;max-width:640px;margin-top:30px;
}
.sugg{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:13px 15px;text-align:left;cursor:pointer;transition:.18s;color:var(--text);
  font-family:var(--font);font-size:13px;line-height:1.6;
}
.sugg:hover{
  border-color:var(--accent1);transform:translateY(-2px);
  box-shadow:0 10px 24px var(--glow);
}
.sugg b{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:3px}
.sugg span{color:var(--text2);font-size:12px}
/* ============ 输入区 ============ */
.composer-wrap{flex:none;padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.composer{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--panel-solid);border:1px solid var(--border-strong);
  border-radius:20px;padding:9px 9px 9px 16px;
  box-shadow:var(--shadow);
  transition:border-color .18s;
}
.composer:focus-within{border-color:var(--accent1);box-shadow:0 0 0 3px var(--glow),var(--shadow)}
#inputBox{
  flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--text);
  font-family:var(--font);font-size:15px;line-height:1.6;max-height:160px;padding:7px 0;
}
#inputBox::placeholder{color:var(--text3)}
#sendBtn{
  width:42px;height:42px;flex:none;border:none;border-radius:14px;cursor:pointer;
  background:var(--user-grad);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:.18s;box-shadow:0 6px 16px rgba(76,125,255,.3);
}
#sendBtn:hover{transform:translateY(-1px);filter:brightness(1.08)}
#sendBtn:active{transform:scale(.95)}
#sendBtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
#sendBtn svg{width:18px;height:18px}
#plusBtn{
  width:42px;height:42px;flex:none;cursor:pointer;
  border:1px solid var(--border-strong);border-radius:14px;background:var(--bubble);
  color:var(--text2);display:flex;align-items:center;justify-content:center;transition:.18s;
}
#plusBtn:hover{color:var(--accent1);border-color:var(--accent1);transform:translateY(-1px)}
#plusBtn:active{transform:scale(.95)}
#plusBtn svg{width:19px;height:19px}

<body>
<!-- 登录层 -->
<div id="authOverlay" class="auth-overlay" hidden>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ic-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ic-sun" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      <button class="hbtn" id="logoutBtn" title="退出登录">

  </header>

  <!-- 消息区 -->

  <!-- 输入区 -->

    <div class="wsbar" id="wsBar" hidden>
      <div class="ws-anchor">
        <button class="lbtn" id="localBtn" title="选择/切换本机工作空间文件夹"><span class="dot"></span><span class="txt">选择工作空间</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>

      </div>

        <button class="lbtn mbtn" id="modelBtn" title="选择回答模型"><span class="dot"></span><span class="txt" id="modelTxt">模型</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>

      </button>

        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5a1 1 0 0 0 0-1.8L3.4 3.6a.9.9 0 0 0-1.2 1l2 6.7a1 1 0 0 0 .8.7l9 .6-9 .6a1 1 0 0 0-.8.7l-2 6.7a.9.9 0 0 0 1.2 1.1z"/></svg>
      </button>
    </div>
    <p class="hint">AI 生成内容仅供参考，请核查重要信息</p>
  </div>

<script>
/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const chatBox = $('#chatBox'), inputBox = $('#inputBox'), sendBtn = $('#sendBtn');
const THEME_KEY = 'mcp-theme';
const TOKEN_KEY = 'mcp-auth-token';
let authToken='', me={name:''};
let myUserRoot='';   // 当前用户工作空间绝对路径，用于把回答里的文件路径变成下载链接
try{authToken=localStorage.getItem(TOKEN_KEY)||''}catch(e){}
const authOverlay=$('#authOverlay'), authUser=$('#authUser'), authPwd=$('#authPwd'),
      authInvite=$('#authInvite'), authErr=$('#authErr'), authLoginBtn=$('#authLoginBtn');
const userBadge=$('#userBadge');
function updateUserBadge(){
  if(!userBadge)return;
  if(me&&me.name){userBadge.textContent=me.name;userBadge.hidden=false}
  else userBadge.hidden=true;
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

/* ================= 极简 Markdown 渲染 ================= */
function mdInline(s){
  const toks=[];
  // 行内代码保护
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>{toks.push('<code>'+c+'</code>');return '\u0000T'+(toks.length-1)+'\u0000'});
  // 链接
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 删除线
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  // 粗体
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // 斜体
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/__([^_]+)__/g,'<em>$1</em>');
  // 还原代码 token
  s=s.replace(/\u0000T(\d+)\u0000/g,(m,i)=>toks[+i]);
  return s;
}
function renderMarkdown(src){
  src=esc(src);
  const blocks=[];
  src=src.replace(/```([\w+#.-]*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<pre><code class="lang-'+lang+'">'+code.replace(/\n$/,'')+'</code></pre>');
    return '\u0000B'+(blocks.length-1)+'\u0000';
  });
  const lines=src.split('\n');
  let out='', para=[], i=0;
  const flush=()=>{if(para.length){out+='<p>'+mdInline(para.join(' '))+'</p>';para=[]}};
  while(i<lines.length){
    const line=lines[i];
    if(line.trim()===''){flush();i++;continue}
    // 代码块
    const cb=line.match(/^\u0000B(\d+)\u0000$/);
    if(cb){flush();out+=blocks[+cb[1]];i++;continue}
    // 分隔线
    if(/^([-*_])\1{2,}$/.test(line.trim())){flush();out+='<hr>';i++;continue}
    // 标题
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){flush();const n=h[1].length;out+='<h'+n+'>'+mdInline(h[2])+'</h'+n+'>';i++;continue}
    // 引用
    if(/^&gt;\s?/.test(line)){
      flush();const q=[];
      while(i<lines.length && /^&gt;\s?/.test(lines[i])){q.push(mdInline(lines[i].replace(/^&gt;\s?/,'')));i++}
      out+='<blockquote>'+q.join('<br>')+'</blockquote>';continue;
    }
    // 无序列表
    const ul=line.match(/^[-*+]\s+(.*)$/);
    if(ul){
      flush();const items=[mdInline(ul[1])];i++;
      while(i<lines.length){const m=lines[i].match(/^[-*+]\s+(.*)$/);if(m){items.push(mdInline(m[1]));i++}else break}
      out+='<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';continue;
    }
    // 有序列表
    const ol=line.match(/^\d+[.、)]\s+(.*)$/);
    if(ol){
      flush();const items=[mdInline(ol[1])];i++;
      while(i<lines.length){const m=lines[i].match(/^\d+[.、)]\s+(.*)$/);if(m){items.push(mdInline(m[1]));i++}else break}
      out+='<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>';continue;
    }
    para.push(line);i++;
  }
  flush();
  return out.replace(/\u0000B(\d+)\u0000/g,(m,i)=>blocks[+i]);
}

// 把渲染后的 HTML 中出现的"本用户工作空间绝对路径"变成可点击的下载链接
function linkifyUserFiles(html){
  if(!html)return html;
  const root=myUserRoot?esc(myUserRoot.replace(/\/+$/,'')).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'):null;
  // 生成下载卡片；失败返回 null（调用方保留原文）
  const mk=(rel)=>{
    // 去掉结尾被顺带吸进来的常见标点/括号
    const clean=rel.replace(/[，。、；：,.!?;:'")\]}>】》]+$/,'');
    if(!clean||clean==='/')return null;
    const name=decodeURIComponent(clean.split('/').pop());
    // 最后一段没有扩展名 → 大概率是目录(如"查看工作目录"回复的路径),不做下载链接
    if(!name.includes('.'))return null;
    // 下载走新标签页直接导航，无法带 Authorization 头 → 把 token 拼进查询参数让后端认
    const href='/api/files/download?path='+encodeURIComponent(clean.replace(/^\//,''))+
      '&token='+encodeURIComponent(authToken);
    // 按扩展名着色的文件类型徽标 + 文件名 + 下载箭头
    const ext=(name.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
    const ico=ext&&ext!==name.toLowerCase().replace('.','')?esc(ext.toUpperCase()):'FILE';
    return '<a class="filedl ext-'+esc(ext||'bin')+'" href="'+href+'" target="_blank" rel="noopener" title="点击保存到你的设备">'+
      '<span class="f-ico">'+ico+'</span><span class="f-name">'+esc(name)+'</span><span class="f-dl">↓</span></a>';
  };
  // ① 上传引用标记([图片: 路径]/[文件: 路径]) → 直接变成下载卡片, 连外壳一起去掉。
  //    路径可能被 AI 包进反引号(渲染成 <code>…</code>) → 必须连 code 外壳一起替换,
  //    否则 code 的背景/边框会在卡片两侧露出长条
  html=html.replace(/<code>\s*(?:\[(?:图片|文件|附件):\s*([^\]]+?)\s*\]|(_uploads\/[^<]*?))\s*<\/code>/g,
    (m,mk1,up)=>{const c=mk(mk1||up);return c||m});
  html=html.replace(/\[(?:图片|文件|附件):\s*([^\]]+?)\s*\]/g,(m,rel)=>mk(rel)||m);
  // ② 用户上传的附件相对路径 _uploads/xxx 的裸路径兜底
  html=html.replace(/(^|[\s（(>：:，,、])(_uploads\/[^\s<>"'`\[\]]+)/g,(m,p1,rel)=>{const c=mk(rel);return c?(p1+c):m});
  if(!root)return html;
  // 路径被 AI 包进反引号时,渲染成 <code>路径</code> —— 必须连外壳一起替换,
  // 否则 code 的背景/边框会在卡片两侧露出长条
  html=html.replace(new RegExp('<code>\\s*('+root+'[^<]*?)\\s*</code>','g'),(m,rel)=>mk(rel)||m);
  // 裸路径兜底
  html=html.replace(new RegExp(root+'(/[^\\s<>"\'`]+)','g'),(m,rel)=>mk(rel)||m);
  return html;
}

/* ================= 消息管理 ================= */
let history=[];   // {role:'user'|'assistant'|'error'|'loading', text, ts?}
let busy=false, controller=null;

// 显示用的时刻：历史消息显示其真实时间，当场新消息显示当前时间
function fmtHM(ts){
  if(!ts)return now();
  const d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// 从服务端拉取“当前用户自己的”历史消息（按用户隔离）
async function loadServerHistory(){
  try{
    const r=await fetch('/api/history',{headers:{'Authorization':'Bearer '+authToken}});
    if(!r.ok){throw new Error('HTTP '+r.status)}
    const d=await r.json();
    if(d&&d.username)me.name=d.username;
    if(d&&d.user_root)myUserRoot=d.user_root;
    history=(d&&Array.isArray(d.messages)?d.messages:[])
      .filter(m=>m&&(m.role==='user'||m.role==='assistant'))
      .map(m=>({role:m.role,text:m.text,ts:m.ts,model:m.model||''}));
  }catch(e){
    history=[];
  }
  updateUserBadge();
  renderAll();
}

const STAR='<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z" fill="#fff"/></svg>';

function renderAll(){
  chatBox.innerHTML='';
  if(!history.length){showWelcome();return}
  history.forEach(item=>chatBox.appendChild(buildMsg(item)));
  scrollBottom();
}
function buildMsg(item){
  const wrap=document.createElement('div');
  if(item.role==='user'){
    wrap.className='msg user';
    wrap.innerHTML='<div class="col"><div class="time">'+fmtHM(item.ts)+'</div><div class="bubble">'+esc(item.text)+'</div></div>';
  }else{
    wrap.className='msg bot';
    if(item.role==='loading')wrap.id='loadingMsg'; // 标记 loading 气泡，便于回复后从 DOM 移除
    let body;
    if(item.role==='loading'){
      body='<div class="bubble"><div class="typing"><span class="dots"><i></i><i></i><i></i></span><span style="color:var(--text2);font-size:13px">正在思考并调用工具…</span>'+
           '<button class="stop-btn" id="stopBtn">⏹ 停止</button></div></div>';
    }else if(item.role==='error'){
      body='<div class="bubble err">'+esc(item.text)+'</div>';
    }else{
      body='<div class="bubble">'+linkifyUserFiles(renderMarkdown(item.text))+'</div>';
    }
    const mchip=(item.role==='assistant'&&item.model)
      ? '<div class="msg-model"><span class="mm-dot"></span>'+esc(item.model)+'</div>' : '';
    wrap.innerHTML='<div class="avatar">'+STAR+'</div><div class="col"><div class="time">'+fmtHM(item.ts)+'</div>'+body+mchip+'</div>';
  }
  return wrap;
}
function push(item){history.push(item);chatBox.appendChild(buildMsg(item));scrollBottom()}
function removeLoading(){
  // loading 仅是视觉态，不入 history；只删 DOM
  const el=document.getElementById('loadingMsg');
  if(el)el.remove();
}
function insertLoading(){
  chatBox.appendChild(buildMsg({role:'loading',text:''}));
  scrollBottom();
}
function scrollBottom(){chatBox.scrollTop=chatBox.scrollHeight}

/* ================= 自绘"米粒"滚动指示条 ================= */
const scrollInd=$('#scrollInd');
let indTimer=null;
function updateScrollInd(){
  if(!scrollInd)return;
  const maxScroll=chatBox.scrollHeight-chatBox.clientHeight;
  const rect=chatBox.getBoundingClientRect();
  const appRect=chatBox.parentElement.getBoundingClientRect();
  const trackH=rect.height;
  const th=Math.max(16,Math.min(32,trackH*0.08)); // 拇指高度：一粒米大小(16~32px)
  scrollInd.style.height=th+'px';
  const ratio=maxScroll>0?chatBox.scrollTop/maxScroll:0;
  scrollInd.style.top=(rect.top-appRect.top+ratio*(trackH-th))+'px';
  scrollInd.classList.add('show');
  clearTimeout(indTimer);
  indTimer=setTimeout(()=>scrollInd.classList.remove('show'),900);
}

let liveMsgEl=null,liveBubbleEl=null,liveTextNode=null;
let liveActLines={}; // 工具名 -> 最近一条动作行元素（完成时更新 / 同名重试收尾）
function liveCleanup(){
  liveMsgEl=null;liveBubbleEl=null;liveTextNode=null;liveActLines={};
}
function pinnedToBottom(){return chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<160}
function scrollKeep(){if(pinnedToBottom())scrollBottom()}
function ensureLiveMsg(){
  liveMsgEl=document.createElement('div');liveMsgEl.className='msg bot';liveMsgEl.id='liveMsg';
  liveMsgEl.innerHTML='<div class="avatar">'+STAR+'</div><div class="col">'+
    '<div class="live-top"><div class="time">'+now()+'</div><button class="stop-mini" id="liveStop" title="停止生成">⏹ 停止</button></div>'+
    '<div class="bubble live" id="liveBubble"></div></div>';
  chatBox.appendChild(liveMsgEl);
  liveBubbleEl=liveMsgEl.querySelector('#liveBubble');
  // 占位也放进文本节点流，保证正文/工具行能与它正确衔接
  liveTextNode=document.createTextNode('⏳ 正在思考…');
  liveBubbleEl.appendChild(liveTextNode);
  liveMsgEl.querySelector('#liveStop').onclick=()=>controller&&controller.abort();
  scrollKeep();
}
// 工具名 -> 中文短名（未收录则显示原名）
const TOOL_LABEL={
  list_directory:'列出目录',read_text_file:'读取文件',write_file:'写入文件',
  edit_file:'修改文件',search_files:'搜索文件',get_file_info:'查看文件信息',
  directory_tree:'查看目录树',read_multiple_files:'批量读取文件',
  create_directory:'新建目录',move_file:'移动文件',copy_file:'复制文件',
  delete_file:'删除文件',run_command:'执行终端命令',
  user_filesystem:'读写本机文件',
  terminal_session_create:'开启终端',web_search:'联网搜索',fetch_page:'抓取网页'
};
function toolLabel(name){
  const t=String(name||'');
  if(t.startsWith('amap_'))return '地图·'+t.slice(5);
  if(TOOL_LABEL[t])return TOOL_LABEL[t];
  return t;
}
// 追加一段流式正文（始终在"当前文本段"的文本节点上续写）
function liveAppend(s){
  if(!liveTextNode){
    liveTextNode=document.createTextNode(s);liveBubbleEl.appendChild(liveTextNode);
  }else if(liveTextNode.data==='⏳ 正在思考…'){
    liveTextNode.data=s; // 占位直接转正文
  }else{
    liveTextNode.appendData(s);
  }
}
// 结束当前文本段：之后的正文会从工具行下方另起一段
function liveBreakSegment(){
  if(liveTextNode&&liveTextNode.data==='⏳ 正在思考…'){liveTextNode.remove();liveTextNode=null;}
  liveTextNode=null;
}
// 在当前文本段正下方插入一条"正在执行"的工具行
function addLiveToolLine(name){
  const line=document.createElement('div');line.className='live-act run';
  line.innerHTML='<span class="a-ico"></span><span class="a-txt"></span>';
  liveBubbleEl.appendChild(line);
  const label=toolLabel(name);
  line.dataset.label=label;
  line.querySelector('.a-txt').textContent='正在执行 '+label+' …';
  return line;
}
// 工具行收尾：成功打勾变淡只留工具名，失败打叉带提示
function settleLiveToolLine(line,ok,note){
  if(!line)return;
  line.className='live-act '+(ok?'done':'fail');
  line.querySelector('.a-ico').textContent=ok?'✓':'✕';
  line.querySelector('.a-txt').textContent=ok?(line.dataset.label||''):('失败：'+(line.dataset.label||''));
  if(note)line.title=note;
}
function finishLiveStream(item){
  // 用正式渲染替换直播节点，并写入页面历史（服务端已完成持久化，无需本地保存）
  const fresh=buildMsg(item);
  if(liveMsgEl)liveMsgEl.replaceWith(fresh);
  liveCleanup();
  history.push(item);scrollKeep();
}
async function send(){
  const q=inputBox.value.trim();
  if(!q||busy)return;
  inputBox.value='';autoGrow();
  push({role:'user',text:q});
  busy=true;sendBtn.disabled=true;
  controller=new AbortController();
  ensureLiveMsg();
  let answer='';
  let answeredModel='';
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
      body:JSON.stringify({query:q,model:modelKey}),
      signal:controller.signal
    });
    if(resp.status===401){
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      push({role:'error',text:'🔒 登录已过期，请重新登录'});
      showAuth('登录已过期，请重新登录');
      return;
    }
    if(!resp.ok){
      let data=null;try{data=await resp.json()}catch(e){}
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      push({role:'error',text:'请求失败：'+(data&&data.detail?data.detail:('HTTP '+resp.status))});
      return;
    }
    if(!resp.body){
      // 极少数不支持流读取的环境：按 JSON 解析整包
      let data=null;try{data=await resp.json()}catch(e){}
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      if(data&&typeof data.answer==='string'){
        const it={role:'assistant',text:data.answer};
        history.push(it);chatBox.appendChild(buildMsg(it));scrollKeep();
      }else{
        push({role:'error',text:'返回格式异常：'+JSON.stringify(data).slice(0,300)});
      }
      return;
    }
    // ---- SSE 流式读取 ----
    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='',streamEnded=false,completed=false;
    while(!streamEnded){
      const r=await reader.read();
      streamEnded=r.done;
      buf+=dec.decode(r.value||new Uint8Array(),{stream:!streamEnded});
      let pos;
      while((pos=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,pos).trim();buf=buf.slice(pos+2);
        if(!raw.startsWith('data:'))continue;
        const payload=raw.slice(5).trim();
        if(!payload||payload==='[DONE]')continue;
        let ev=null;try{ev=JSON.parse(payload)}catch(e){continue}
        if(ev.type==='answer'&&ev.delta){
          answer+=ev.delta;
          if(liveBubbleEl)liveAppend(ev.delta);
          scrollKeep();
        }else if(ev.type==='tool'&&ev.name){
          const name=ev.name;
          if(ev.status==='start'){
            // 结束当前文本段，把工具行插在这段文字正下方
            const prev=liveActLines[name];
            if(prev&&prev.className==='live-act')settleLiveToolLine(prev,true); // 同名重试：上一行先收尾
            liveBreakSegment();
            liveActLines[name]=addLiveToolLine(name);
          }else{
            settleLiveToolLine(liveActLines[name],ev.status==='ok',ev.note||'');
          }
          scrollKeep();
        }else if(ev.type==='done'){
          if(ev.answer!==undefined)answer=ev.answer;
          if(ev.model_key)answeredModel=modelLabel(ev.model_key);
          completed=true;
        }else if(ev.type==='error'){
          throw new Error(ev.message||'服务端流式错误');
        }
      }
      if(completed)break;
    }
    // 结束：用最终全文渲染替换直播气泡
    const it={role:'assistant',text:(answer&&answer.trim())?answer:'（无回答）',
              model:answeredModel||modelLabel(modelKey)};
    finishLiveStream(it);
  }catch(err){
    const el=liveMsgEl;el&&el.remove();liveCleanup();
    if(err&&err.name==='AbortError'){
      push({role:'assistant',text:'⚠️ 已停止生成。'});
    }else{
      push({role:'error',text:'请求出错：'+(err&&err.message?err.message:'未知错误')+'（请确认服务已启动）'});
    }
  }finally{
    busy=false;sendBtn.disabled=false;controller=null;
    inputBox.focus();
  }
}

/* IndexedDB: 每用户最近 3 个授权目录句柄列表(本浏览器本地) */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('hj_mcp_local',2);r.onupgradeneeded=e=>{const db=r.result;if(!db.objectStoreNames.contains('dirs'))db.createObjectStore('dirs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbReq(db,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction('dirs',mode).objectStore('dirs');const q=fn(tx);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbGet(k){const db=await idbOpen();try{return await idbReq(db,'readonly',s=>s.get(k))}finally{db.close()}}
async function idbSet(k,v){const db=await idbOpen();try{await idbReq(db,'readwrite',s=>s.put(v,k))}finally{db.close()}}
async function idbDel(k){const db=await idbOpen();try{await idbReq(db,'readwrite',s=>s.delete(k))}finally{db.close()}}

/* 工作空间记录: {list:[{name,handle},...]} 最多3条, 新的在前 */
const MAX_WS=3;
function wsKey(){return 'wslist_'+me.name}
async function loadWsList(){
  if(!me.name)return[];
  try{
    const v=await idbGet(wsKey());
    // 兼容旧版: 旧结构是单个 handle 直接存 me.name 下
    if(!v||!Array.isArray(v.list)){
      const old=await idbGet(me.name);
      if(old&&old.name){const nv={list:[{name:old.name,handle:old}]};await idbSet(wsKey(),nv);return nv.list}
      return v&&v.list?v.list:[];
    }
    return v.list;
  }catch(e){return[]}
}
async function saveWsList(list){
  if(!me.name)return;
  try{await idbSet(wsKey(),{list})}catch(e){}
}
// 挑选/写入目录句柄后, 把该目录排到最近列表最前(去重, 最多保留 MAX_WS 个)
async function rememberWs(h){
  const list=await loadWsList();
  const next=[{name:h.name,handle:h}].concat(list.filter(x=>x&&x.name!==h.name)).slice(0,MAX_WS);
  await saveWsList(next);
  return next;
}
async function forgetWs(name){
  const list=await loadWsList();
  await saveWsList(list.filter(x=>x&&x.name!==name));
}

async function switchWsTo(name){

/* 授权目录内的文件操作(由后端经 WS 下达, 结果回传) */
async function fsopExec(op,path,content){
  if(!localHandle)return{ok:false,error:'尚未选择工作空间。请点击输入框上方的“选择工作空间”按钮授权本机文件夹后重试。'};
  const parts=(path||'').split('/').filter(Boolean);
  try{
    if(op==='list'){
      let d=localHandle;
      for(const p of parts)d=await d.getDirectoryHandle(p,{create:false});
      const items=[];
      for await(const[n,hd]of d.entries())items.push({n,k:hd.kind==='directory'?'dir':'file'});
      items.sort((a,b)=>a.k===b.k?(a.n<b.n?-1:1):(a.k==='dir'?-1:1));
      const who=parts.join('/')||'(授权根目录)';
      if(!items.length)return{ok:true,data:'['+who+'] 为空目录'};
      return{ok:true,data:'['+who+'] 共 '+items.length+' 项\n'+items.map(x=>x.k==='dir'?x.n+'/':x.n).join('\n')};
    }
    if(op==='read'){
      if(!parts.length)return{ok:false,error:'read 需要指定文件名'};
      let d=localHandle;
      for(const p of parts.slice(0,-1))d=await d.getDirectoryHandle(p,{create:false});
      const fh=await d.getFileHandle(parts[parts.length-1],{create:false});
      const f=await fh.getFile();
      const cap=400000;
      const txt=f.size>cap?(await f.slice(0,cap).text())+'\n…(文件较大,仅截取前 '+cap+' 字符)':await f.text();
      return{ok:true,data:'[本机文件] '+f.name+' ('+f.size+' bytes)\n'+txt};
    }
    if(op==='write'){
      if(!parts.length)return{ok:false,error:'write 需要指定文件名'};
      const perm=await localHandle.queryPermission({mode:'readwrite'});
      if(perm==='prompt')return{ok:false,error:'浏览器要求重新确认写入权限：请点击输入框上方的“工作空间”按钮(会弹出允许框)后重试。'};
      if(perm==='denied')return{ok:false,error:'写入权限已被拒绝。请在地址栏左侧权限设置里允许该网站，或重新授权文件夹。'};
      let d=localHandle;
      for(const p of parts.slice(0,-1))d=await d.getDirectoryHandle(p,{create:true});
      const fh=await d.getFileHandle(parts[parts.length-1],{create:true});
      const w=await fh.createWritable();await w.write(content);await w.close();
      return{ok:true,data:'已写入本机文件 '+fh.name+' ('+content.length+' 字符)'};
    }
    return{ok:false,error:'未知操作 '+op};
  }catch(e){return{ok:false,error:'本机文件操作失败：'+e.message}}
}

/* WebSocket 通道: 后端把 user_filesystem 调用推到浏览器执行 */
function wsStart(){
  if(!authToken)return;
  if(ws){try{ws.close()}catch(e){}}
  const proto=location.protocol==='https:'?'wss://':'ws://';
  let closed=false;
  const sk=new WebSocket(proto+location.host+'/ws?token='+encodeURIComponent(authToken));
  sk.onmessage=async(e)=>{
    let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(!m||m.type!=='fsop')return;
    const r=await fsopExec(m.op,m.path,m.content);
    try{sk.send(JSON.stringify({type:'fsop_result',id:m.id,ok:r.ok,data:r.ok?r.data:undefined,error:r.ok?undefined:r.error}))}catch(_){}
  };
  sk.onclose=()=>{if(closed)return;if(ws===sk)ws=null;if(authToken)setTimeout(wsStart,1500)};
  sk.onerror=()=>{try{sk.close()}catch(_){}};
  ws=sk;
}
function wsStop(){
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}}
  ws=null;
}

/* =============== 文件上传(+ 按钮)：图片/文档/表格/压缩包… 任意类型 =============== */
/* 桌面: 点 + 弹文件对话框 / 拖拽到输入框 / Ctrl+V 粘贴；移动端: 点 + 由系统弹层选(拍照、相册、文件) */
const MAX_UP=8*1024*1024;
const IMG_RE=/\.(png|jpe?g|gif|webp|bmp|svg|ico|heic|heif|avif|tiff?)$/i;
const plusBtn=$('#plusBtn'), fileInput=$('#fileInput'), composerEl=$('.composer');
const IS_MOBILE=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||/Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent||'');
// 生成插入输入框的引用标记：图片=[图片: 路径]，其他=[文件: 路径]，AI 据此读取该文件
function attachMark(path,name,type){
  const isImg=(type&&type.indexOf('image/')===0)||IMG_RE.test(name||path||'');
  return (isImg?'[图片: ':'[文件: ')+path+']';
}
/* 统一上传入口：任意文件 → 服务器工作空间 _uploads/，成功后把引用插入输入框 */
async function uploadFiles(files){
  const list=[...(files||[])].filter(Boolean);
  if(!list.length)return [];
  if(plusBtn)plusBtn.classList.add('busy');
  const ok=[];
  try{
    for(const f of list){
      const fname=f.name||('file_'+Date.now());
      if(f.size>MAX_UP){toast('「'+fname+'」超过 8MB，已跳过');continue}
      const fd=new FormData();fd.append('file',f,fname);
      try{
        const r=await fetch('/api/uploads',{method:'POST',headers:{'Authorization':'Bearer '+authToken},body:fd});
        const d=await r.json().catch(()=>({}));
        if(r.ok&&d.path)ok.push({path:d.path,name:d.name||fname,type:f.type});
        else toast('上传失败：'+(d.detail||('HTTP '+r.status)));
      }catch(e){toast('上传失败：'+e.message)}
    }
  }finally{
    if(plusBtn)plusBtn.classList.remove('busy');
    if(fileInput)fileInput.value='';
    if(localUp)localUp.value='';
  }
  if(ok.length){
    const mark=ok.map(o=>attachMark(o.path,o.name,o.type)).join(' ');
    inputBox.value=(inputBox.value?inputBox.value.replace(/\s+$/,'')+' ':'')+mark+' ';
    autoGrow();inputBox.focus();
    toast('已上传 '+ok.length+' 个文件'+(IS_MOBILE?'，可补充说明后发送':'（引用已插入输入框），可补充说明后发送'));
  }
  return ok;
}
if(plusBtn)plusBtn.onclick=()=>{fileInput&&fileInput.click()};
if(fileInput)fileInput.onchange=e=>{uploadFiles(e.target.files)};
if(composerEl){
  composerEl.addEventListener('dragover',e=>{e.preventDefault();composerEl.classList.add('dragover')});
  composerEl.addEventListener('dragleave',()=>composerEl.classList.remove('dragover'));
  composerEl.addEventListener('drop',e=>{
    const fs=e.dataTransfer&&e.dataTransfer.files;
    if(fs&&fs.length){e.preventDefault();composerEl.classList.remove('dragover');uploadFiles(fs)}
  });
}
document.addEventListener('paste',e=>{
  const fs=e.clipboardData&&e.clipboardData.files;
  if(fs&&fs.length)uploadFiles(fs);
});
/* =============== 文件上传 end =============== */

async function localBtnClick(){
  if(!window.showDirectoryPicker||!window.FileSystemDirectoryHandle){
    localUp.click();
    return;
  }
  // 统一行为: 点开=上拉菜单(最近空间列表 + 新建工作空间)
  toggleWsMenu();
}
function toggleWsMenu(){
  const menu=$('#wsMenu');
  if(!menu||!localSupported)return;
  if(!menu.hidden){closeWsMenu();return}
  openWsMenu();
  if(localBtn)localBtn.classList.add('open');
}
async function openWsMenu(){
  const menu=$('#wsMenu');
  if(!menu||!localSupported)return;
  const list=await loadWsList();
  const curName=localHandle?localHandle.name:'';
  let html='<div class="ws-hd"><span>最近工作空间</span><span>'+list.length+'/'+MAX_WS+'</span></div>';
  if(!list.length){
    html+='<div style="padding:8px 10px;font-size:12px;color:var(--text3)">还没有工作空间，点下面按钮新建</div>';
  }else{
    list.forEach(it=>{
      const isCur=it.name===curName;
      html+='<button class="ws-item" data-name="'+esc(it.name)+'">'+
        '<span class="wi-ico">'+(isCur?'📁':'🗂')+'</span>'+
        '<span class="wi-name">'+esc(it.name)+'</span>'+
        (isCur?'<span class="wi-now">当前</span>':'')+
        '<span class="wi-del" title="从列表移除">✕</span>'+
      '</button>';
    });
  }
  html+='<div class="ws-sep"></div>';
  html+='<button class="ws-add" id="wsAddNew">＋ 新建工作空间</button>';
  menu.innerHTML=html;
  menu.querySelectorAll('.ws-item').forEach(btn=>{
    const nm=btn.dataset.name;
    btn.querySelector('.wi-del').onclick=async ev=>{
      ev.stopPropagation();
      await forgetWs(nm);
      if(localHandle&&localHandle.name===nm)localHandle=null;
      openWsMenu();localStatus();
    };
    btn.onclick=async()=>{
      const name=btn.dataset.name;
      if(localHandle&&localHandle.name===name){closeWsMenu();return}
      await switchWsTo(name);
    };
  });
  const add=menu.querySelector('#wsAddNew');
  if(add)add.onclick=()=>{closeWsMenu();pickLocalDir()};
  menu.hidden=false;
}
function closeWsMenu(){
  const menu=$('#wsMenu');
  if(menu)menu.hidden=true;
  if(localBtn)localBtn.classList.remove('open');
}
document.addEventListener('click',e=>{
  const menu=$('#wsMenu'),bar=$('#wsBar');
  if(menu&&!menu.hidden&&bar&&!bar.contains(e.target))closeWsMenu();
});
if(localBtn)localBtn.onclick=localBtnClick;
if(localUp)localUp.onchange=e=>{uploadFiles([...e.target.files]);e.target.value=''};

/* =============== 模型选择(回答用哪个模型, 逐轮生效) =============== */
const MODEL_KEY='hj_mcp_model';
const modelBtn=$('#modelBtn'), modelMenu=$('#modelMenu');
let modelList=[], modelDefault='', modelKey='';
function modelLabel(key){
  const it=modelList.find(m=>m.key===key);
  return it?it.label:(key||'');
}
function renderModelBtn(){
  if(!modelBtn)return;
  modelBtn.hidden=false;
  const cur=modelList.find(m=>m.key===modelKey);
  const txt=$('#modelTxt');
  if(txt)txt.textContent=cur?cur.label:(modelList.length?'模型':'模型');
  modelBtn.title=cur
    ? ('当前模型：'+cur.label+(cur.thinking?'（思考模式）':'')+'　点击切换')
    : '选择回答模型';
}
function openModelMenu(){
  if(!modelMenu)return;
  if(!modelList.length){
    modelMenu.innerHTML='<div class="ws-hd"><span>回答模型</span></div>'+
      '<div style="padding:8px 10px;font-size:12px;color:var(--text3)">模型列表未加载</div>';
    modelMenu.hidden=false;return;
  }
  let html='<div class="ws-hd"><span>选择回答模型</span><span>'+(modelKey===modelDefault?'默认':'')+'</span></div>';
  modelList.forEach(m=>{
    const isCur=m.key===modelKey;
    html+='<button class="ws-item" data-key="'+esc(m.key)+'">'+
      '<span class="wi-ico">'+(m.thinking?'🧠':'⚡')+'</span>'+
      '<span class="wi-name">'+esc(m.label)+'</span>'+
      '<span class="wi-tag">'+(m.thinking?'思考':'快答')+'</span>'+
      (isCur?'<span class="wi-check">✓</span>':'')+
    '</button>';
  });
  modelMenu.innerHTML=html;
  modelMenu.querySelectorAll('.ws-item').forEach(btn=>{
    btn.onclick=()=>{setModel(btn.dataset.key);closeModelMenu()};
  });
  modelMenu.hidden=false;
}
function closeModelMenu(){
  if(modelMenu)modelMenu.hidden=true;
  if(modelBtn)modelBtn.classList.remove('open');
}
function toggleModelMenu(){
  if(!modelMenu)return;
  if(!modelMenu.hidden){closeModelMenu();return}
  openModelMenu();
  if(modelBtn)modelBtn.classList.add('open');
}
function setModel(key){
  if(!key)return;
  modelKey=key;
  try{localStorage.setItem(MODEL_KEY,key)}catch(e){}
  renderModelBtn();
}
async function loadModels(){
  try{
    const r=await fetch('/api/models',{headers:{'Authorization':'Bearer '+authToken}});
    if(!r.ok)return;
    const d=await r.json();
    modelList=Array.isArray(d.models)?d.models:[];
    modelDefault=d.default||((modelList[0]&&modelList[0].key)||'');
    let saved='';
    try{saved=localStorage.getItem(MODEL_KEY)||''}catch(e){}
    modelKey=modelList.some(m=>m.key===saved)?saved:modelDefault;
    renderModelBtn();
  }catch(e){/* 拉不到就用默认, 不影响对话 */}
}
if(modelBtn)modelBtn.onclick=toggleModelMenu;
document.addEventListener('click',e=>{
  if(!modelMenu||modelMenu.hidden)return;
  const anchor=modelBtn&&modelBtn.parentElement;
  if(anchor&&!anchor.contains(e.target))closeModelMenu();
});
/* =============== 模型选择 end =============== */
/* =============== 本机文件桥 end =============== */

(async function initAuth(){
  if(!authToken){showAuth();return}
  try{
    const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+authToken}});
    if(r.ok){
      const d=await r.json();
      me.name=(d&&d.username)||'';
      myUserRoot=(d&&d.user_root)||'';
      hideAuth();
      await loadServerHistory();   // 历史按登录用户加载，互不可见
      await loadModels();          // 可选模型清单
      localStatus();wsStart();await restoreLocalHandle();
      inputBox.focus();
      return;
    }
  }catch(e){/* 网络错误走下方统一登出 */}
  authToken='';
  try{localStorage.removeItem(TOKEN_KEY)}catch(e){}
  showAuth('登录已过期，请重新登录');
})();
</script>
