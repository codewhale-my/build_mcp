<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HJ_MCP Agent🐋 · 全能助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<script>
// 主题：localStorage 优先，其次跟随系统；提前执行防止闪烁
(function(){
  try{
    var t = localStorage.getItem('mcp-theme');
    if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
// 锁缩放兜底：iOS Safari 会忽略 viewport 的 user-scalable=no，用 Safari 专有 gesture 事件再拦一层。
// 只拦双指缩放手势，不动 touchend，因此点击、滚动、代码块横向滑动都不受影响。
['gesturestart','gesturechange','gestureend'].forEach(function(n){
  document.addEventListener(n, function(e){ e.preventDefault(); }, {passive:false});
});
</script>
<style>
:root{
  --radius:16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Courier New", monospace;
}
/* ============ 深色主题 ============ */
html[data-theme="dark"]{
  --bg0:#07090f; --bg1:#0d1017;
  --panel:rgba(255,255,255,.042);
  --panel-solid:#151926;
  --border:rgba(255,255,255,.085);
  --border-strong:rgba(255,255,255,.16);
  --text:#e9ebf3; --text2:#99a1b3; --text3:#5f677e;
  --accent1:#4c7dff; --accent2:#9a6bff;
  --user-grad:linear-gradient(135deg,#3d6dff,#8b5cf6);
  --bubble:rgba(255,255,255,.045);
  --code-bg:#0a0d14;
  --code-head:#0d1119;
  --err-bg:rgba(255,80,110,.09); --err-bd:rgba(255,90,120,.45); --err-tx:#ff8fa3;
  --glow:rgba(76,125,255,.16);
  --shadow:0 12px 34px rgba(0,0,0,.38);
  color-scheme:dark;
}
/* ============ 浅色主题 ============ */
html[data-theme="light"]{
  --bg0:#eef1f8; --bg1:#f6f7fc;
  --panel:#ffffff;
  --panel-solid:#ffffff;
  --border:#e2e6f0;
  --border-strong:#cdd4e4;
  --text:#191e2c; --text2:#5b6474; --text3:#8b93a5;
  --accent1:#2f6bff; --accent2:#7c4dff;
  --user-grad:linear-gradient(135deg,#2f6bff,#7c4dff);
  --bubble:#ffffff;
  --code-bg:#f3f5fb;
  --code-head:#eceff8;
  --err-bg:#fff0f2; --err-bd:#ffc2cc; --err-tx:#d33855;
  --glow:rgba(47,107,255,.10);
  --shadow:0 12px 30px rgba(30,42,80,.10);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 手机端锁死缩放：
   touch-action:pan-x pan-y = 允许两方向平移、【不允许】双指缩放和双击缩放
   （不含 pinch-zoom，因此 iOS/Android 都无法再缩放，也不会把页面拉偏） */
html,body{
  height:100%;width:100%;max-width:100%;overflow:hidden;
  overscroll-behavior:none;
  touch-action:pan-x pan-y;
}
body{
  font-family:var(--font);
  background:var(--bg1);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
/* 背景氛围光斑 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(600px 400px at 12% -10%, var(--glow), transparent 60%),
    radial-gradient(700px 500px at 105% 8%, var(--glow), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, var(--glow), transparent 60%);
}
.app{
  /* 用 svh（地址栏展开时的最小视口高）而不是 dvh：dvh 会随地址栏显隐实时变高变矮，
     整个界面跟着上下抽动，就是手机上“晃来晃去”的来源之一 */
  position:relative;z-index:1;height:100vh;height:100svh;max-width:880px;margin:0 auto;
  display:flex;flex-direction:column;padding:0 18px;
}
/* ============ 顶栏 ============ */
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 2px 12px;flex:none;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(76,125,255,.35);
}
.logo svg{width:20px;height:20px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--text2);margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tool-chip{
  font-size:11px;color:var(--text2);padding:2px 8px;border-radius:99px;
  background:var(--panel);border:1px solid var(--border);white-space:nowrap;
}
.hbtns{display:flex;gap:6px;flex:none}
.hbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:.18s;
}
.hbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--panel-solid)}
.hbtn svg{width:17px;height:17px}
/* 有未读更新时的小红点 */
.hbtn{position:relative}
.hdot{
  position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;
  background:#ff4d4f;box-shadow:0 0 0 2px var(--panel);
}
.hdot[hidden]{display:none}
/* 本机文件授权按钮(桌面 Chrome/Edge 目录授权, 其余浏览器降级上传) */
.lbtn{
  display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 11px;border-radius:9px;
  font-size:12.5px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--border);background:var(--panel-solid);color:var(--text2);
  transition:border-color .15s,color .15s;
}
.lbtn:hover{color:var(--text);border-color:var(--border-strong)}
.lbtn .dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex:none}
.lbtn.on{border-color:color-mix(in srgb,var(--accent1) 45%,var(--border));color:var(--accent1)}
.lbtn.on .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.lbtn .txt{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.lbtn.err .dot{background:var(--err-tx)}
/* 输入框上方的工作空间条 */
.wsbar{
  display:flex;align-items:center;justify-content:flex-start;gap:8px;
  padding:2px 2px 8px;flex:none;
}
.wsbar[hidden]{display:none}
.ws-anchor{position:relative;display:inline-flex}
/* 模型选择按钮(与工作空间按钮同款外观, 位于其右侧) */
.m-anchor{position:relative;display:inline-flex}
.mbtn .txt{max-width:150px}
.mbtn .dot{background:var(--accent1);opacity:.85}
/* 精确定位开关(浏览器 Geolocation) */
.gbtn .dot{background:#94a3b8;opacity:.9}
.gbtn.busy .dot{background:var(--accent1);animation:a-pulse 1s ease-in-out infinite}
.gbtn.err .txt{color:var(--text3)}
.ws-item .wi-tag{
  flex:none;font-size:10.5px;padding:1px 6px;border-radius:6px;
  background:var(--panel);color:var(--text3);border:1px solid var(--border);
}
.ws-item .wi-check{flex:none;color:var(--accent1);font-weight:700}
/* 回答下方的小字：本轮由哪个模型回答 */
.msg-model{font-size:11px;color:var(--text3);margin-top:5px;opacity:.9}
.msg-usage{font-size:11px;color:var(--text3);margin-top:2px;opacity:.85;font-variant-numeric:tabular-nums}
.msg-model .mm-dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent1);
  margin-right:5px;vertical-align:middle;opacity:.8;
}
.lbtn .chev{width:11px;height:11px;flex:none;opacity:.7;transition:transform .18s}
.lbtn.open .chev{transform:rotate(180deg)}
.ws-menu{
  position:absolute;left:0;bottom:calc(100% + 8px);z-index:60;min-width:230px;max-width:320px;
  max-height:min(58vh,400px);overflow-y:auto;
  background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:13px;
  box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;
  animation:pop .16s ease;transform-origin:bottom left;
}
.ws-menu[hidden]{display:none}
.ws-hd{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:11px;color:var(--text3);padding:5px 10px 6px;
}
.ws-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border-radius:9px;border:none;background:none;cursor:pointer;
  font-family:var(--font);font-size:13px;color:var(--text);transition:background .12s;
}
.ws-item:hover{background:var(--panel)}
.ws-item .wi-ico{flex:none;font-size:14px}
.ws-item .wi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-item .wi-now{flex:none;font-size:11px;color:var(--accent1)}
.ws-item .wi-del{flex:none;font-size:12px;color:var(--text3);padding:2px 6px;border-radius:6px}
.ws-item .wi-del:hover{color:var(--err-tx);background:var(--err-bg)}
.ws-sep{height:1px;background:var(--border);margin:4px 6px}
.ws-add{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border-radius:9px;border:none;background:none;cursor:pointer;
  font-family:var(--font);font-size:13px;color:var(--accent1);transition:background .12s;
}
.ws-add:hover{background:var(--panel)}
/* 当前登录用户徽标 */
.user-badge{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
  border-radius:999px;border:1px solid var(--border);background:var(--panel);
  font-size:12.5px;color:var(--text2);max-width:150px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.user-badge::before{content:"👤";font-size:12px;flex:none}
.user-badge[hidden]{display:none}
@media (max-width:600px){.user-badge{max-width:64px;padding:0 8px;font-size:11px;height:30px;gap:4px}}
/* ============ 消息区 ============ */
/* 隐藏原生滚动条（长度由浏览器控制，无法自定义），改用自绘"米粒"指示条 */
#chatBox{
  flex:1;overflow-y:auto;padding:20px 10px 12px 2px;
  /* 不能用 scroll-behavior:smooth：流式输出时内容不停长高，平滑动画会被后续的贴底
     请求反复打断，滚动"卡在半路"反而到不了底。贴底改由 JS 每帧直接赋值 scrollTop。 */
  scrollbar-width:none; /* Firefox 隐藏 */
  overflow-anchor:none; /* 关掉浏览器自带滚动锚定，否则会和手动贴底互抢控制权 */
  overscroll-behavior:contain;
}
#chatBox::-webkit-scrollbar{display:none}
/* 自绘滚动指示条：固定高度的小短条，滚动时出现，停止后淡出 */
.chat-scroll-ind{
  position:absolute;right:4px;top:80px;width:4px;height:20px;border-radius:4px;
  background:var(--text3);opacity:0;transition:opacity .4s;pointer-events:none;z-index:5;
}
.chat-scroll-ind.show{opacity:.75}
/* 一键回到底部：已贴底时隐藏；用户往回翻 / 未跟随时淡入 */
.jump-btn{
  position:absolute;left:50%;transform:translateX(-50%) translateY(6px);
  bottom:calc(132px + env(safe-area-inset-bottom));
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit;
  border:1px solid var(--border-strong);background:var(--panel-solid);color:var(--text2);
  font-size:12.5px;font-weight:500;line-height:1;
  box-shadow:0 6px 18px rgba(0,0,0,.16);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:6;
}
.jump-btn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.jump-btn:active{transform:translateX(-50%) scale(.96)}
@media (max-width:600px){.jump-btn{bottom:calc(104px + env(safe-area-inset-bottom))}}
/* 「正在回答」状态胶囊：挂在直播间的时间行上，让用户一眼知道已经在跑了 */
.live-status{
  display:inline-flex;align-items:center;gap:6px;margin-left:9px;
  padding:2.5px 9px;border-radius:999px;font-size:11px;color:var(--accent1);
  background:color-mix(in srgb,var(--accent1) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--accent1) 30%,transparent);
}
.live-status .ls-dot{
  width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;
  animation:ls-pulse 1.1s ease-in-out infinite;
}
@keyframes ls-pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.msg{display:flex;gap:11px;margin-bottom:22px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  width:32px;height:32px;flex:none;border-radius:10px;margin-top:2px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(76,125,255,.3);
}
.avatar svg{width:15px;height:15px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg.user .col{align-items:flex-end}
.time{font-size:11px;color:var(--text3);margin:0 4px 5px}
.bubble{
  max-width:100%;padding:12px 15px;border-radius:var(--radius);
  line-height:1.75;font-size:14.5px;word-break:break-word;overflow-wrap:break-word;
}
.bot .bubble{
  background:var(--bubble);border:1px solid var(--border);
  border-top-left-radius:5px;width:100%;
  box-shadow:var(--shadow);
}
.user .bubble{
  background:var(--user-grad);color:#fff;
  border-top-right-radius:5px;
  box-shadow:0 8px 20px rgba(76,125,255,.25);
  white-space:pre-wrap;
}
/* ---------- 气泡内 Markdown 排版 ---------- */
.bubble p{margin:0 0 10px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{
  margin:16px 0 8px;line-height:1.4;font-weight:700;
}
.bubble h1{font-size:19px}.bubble h2{font-size:17px}
.bubble h3{font-size:15.5px}.bubble h4{font-size:14.5px}
.bubble ul,.bubble ol{margin:4px 0 10px;padding-left:22px}
.bubble li{margin:3px 0}
.bubble a{color:var(--accent1);text-decoration:none;border-bottom:1px dashed var(--border-strong)}
/* 工作空间文件下载卡片（点击保存到本机/手机） */
.bubble a.filedl{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 12px 6px 6px;margin:2px 4px;border-radius:10px;
  border:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel-solid),color-mix(in srgb,var(--panel-solid) 88%,var(--accent1) 12%));
  color:var(--text);font-size:13px;font-weight:500;text-decoration:none;vertical-align:baseline;
  box-shadow:0 1px 4px rgba(0,0,0,.07);transition:border-color .15s,transform .12s,box-shadow .15s;
}
.bubble a.filedl:hover{
  border-color:var(--accent1);transform:translateY(-1px);
  box-shadow:0 3px 10px rgba(76,125,255,.18);
}
/* 左侧文件类型徽标：按扩展名渐变着色 */
.bubble a.filedl .f-ico{
  width:26px;height:26px;border-radius:7px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;letter-spacing:.4px;color:#fff;
  background:linear-gradient(135deg,#4c7dff,#9a6bff);
}
.bubble a.filedl.ext-md .f-ico,.bubble a.filedl.ext-markdown .f-ico{background:linear-gradient(135deg,#4c7dff,#38bdf8)}
.bubble a.filedl.ext-txt .f-ico,.bubble a.filedl.ext-log .f-ico{background:linear-gradient(135deg,#64748b,#94a3b8)}
.bubble a.filedl.ext-pdf .f-ico{background:linear-gradient(135deg,#ef4444,#f97316)}
.bubble a.filedl.ext-doc .f-ico,.bubble a.filedl.ext-docx .f-ico{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.bubble a.filedl.ext-xls .f-ico,.bubble a.filedl.ext-xlsx .f-ico,.bubble a.filedl.ext-csv .f-ico{background:linear-gradient(135deg,#059669,#34d399)}
.bubble a.filedl.ext-ppt .f-ico,.bubble a.filedl.ext-pptx .f-ico{background:linear-gradient(135deg,#ea580c,#fb923c)}
.bubble a.filedl.ext-zip .f-ico,.bubble a.filedl.ext-tar .f-ico,.bubble a.filedl.ext-gz .f-ico{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.bubble a.filedl.ext-py .f-ico,.bubble a.filedl.ext-js .f-ico,.bubble a.filedl.ext-ts .f-ico,.bubble a.filedl.ext-json .f-ico,.bubble a.filedl.ext-sh .f-ico{background:linear-gradient(135deg,#0d9488,#2dd4bf)}
/* Markdown 表格 */
.bubble .tblwrap{overflow-x:auto;margin:.55em 0;border:1px solid var(--border);border-radius:10px}
.bubble table{border-collapse:collapse;width:100%;font-size:.92em}
.bubble th,.bubble td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:6px 11px;text-align:left;vertical-align:top}
.bubble th:last-child,.bubble td:last-child{border-right:none}
.bubble tbody tr:last-child td{border-bottom:none}
.bubble thead th{background:var(--panel);font-weight:600;white-space:nowrap}
.bubble tbody tr:nth-child(even) td{background:var(--panel)}
/* 文件名过长省略 */
.bubble a.filedl .f-name{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 右侧下载箭头：hover 时高亮 */
.bubble a.filedl .f-dl{
  width:20px;height:20px;border-radius:50%;flex:none;margin-left:2px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--accent1);background:transparent;
  border:1px solid transparent;transition:all .15s;
}
.bubble a.filedl:hover .f-dl{
  background:color-mix(in srgb,var(--accent1) 14%,transparent);
  border-color:color-mix(in srgb,var(--accent1) 35%,transparent);
}
.bubble a:hover{opacity:.85}
.bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.bubble blockquote{
  margin:10px 0;padding:4px 14px;border-left:3px solid var(--accent1);
  background:var(--panel);border-radius:0 8px 8px 0;color:var(--text2);
}
.bubble code{
  font-family:var(--mono);font-size:12.8px;background:var(--code-bg);
  border:1px solid var(--border);padding:1.5px 6px;border-radius:6px;
}
/* 图片/视频/画布兜底：任何情况下都不许撑破气泡宽度（否则整行超宽，左侧头像会被推出屏幕） */
.bubble img,.bubble video,.bubble canvas,.bubble iframe{
  max-width:100%;height:auto;border-radius:10px;
}
.bubble pre{
  margin:10px 0;padding:12px 14px;border-radius:12px;overflow:auto;max-width:100%;
  background:var(--code-bg);border:1px solid var(--border);
}
.bubble pre code{background:none;border:none;padding:0;font-size:12.8px;line-height:1.6;display:block}
.bubble pre::-webkit-scrollbar{height:7px}
.bubble pre::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
/* ---------- 错误气泡 ---------- */
.bubble.err{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-tx)}
/* ---------- 思考动画 ---------- */
.typing{display:flex;align-items:center;gap:10px}
.dots{display:inline-flex;gap:4px;padding:2px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.stop-btn{
  margin-left:auto;flex:none;font-size:12px;color:var(--text2);cursor:pointer;
  border:1px solid var(--border);background:var(--panel);border-radius:8px;
  padding:3px 9px;transition:.15s;display:flex;align-items:center;gap:4px;
}
.stop-btn:hover{color:var(--err-tx);border-color:var(--err-bd)}
/* ---------- 「继续」按钮：接在被截断的回答下面 ---------- */
.cont-btn{
  margin:8px 0 2px;padding:5px 13px;font-size:13px;cursor:pointer;color:#2563eb;
  background:transparent;border:1px dashed #9aa4b2;border-radius:14px;
  display:inline-flex;align-items:center;gap:6px;line-height:1.2;
}
.cont-btn:hover{color:#fff;background:#2563eb;border-style:solid;border-color:#2563eb}
.cont-btn[disabled]{opacity:.55;cursor:default}
/* 续写活动状态行：模型可能先去调工具，必须让用户看见它在动，而不是「点了没反应」 */
.cont-act{margin-top:9px;font-size:12.5px;color:var(--accent1);line-height:1.5}
.cont-hint{font-size:12px;color:var(--text2,#8b949e);margin-left:8px}
.cont-live{white-space:pre-wrap}
/* ---------- 流式消息：头部行/停止按钮/工具徽章 ---------- */
.live-top{display:flex;align-items:center;width:100%;margin:0 0 2px}
.live-top .time{margin:0}
.stop-mini{
  margin-left:auto;flex:none;font-size:11px;color:var(--text2);cursor:pointer;
  border:1px solid var(--border);background:var(--panel);border-radius:8px;
  padding:2px 8px;transition:.15s;display:flex;align-items:center;gap:3px;
}
.stop-mini:hover{color:var(--err-tx);border-color:var(--err-bd)}
.bubble.live{color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.6}
/* 流式正文中穿插的工具动作行：紧跟所在段落，浅色小字 */
.live-act{
  display:flex;align-items:center;gap:8px;
  margin:10px 0 12px;padding:2px 0;
  font-size:12.4px;line-height:1.45;color:var(--text2);
  user-select:none;
}
.live-act .a-ico{
  flex:none;width:15px;height:15px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;
}
.live-act.run .a-ico{background:var(--accent1);animation:a-pulse 1.1s ease-in-out infinite}
.live-act.done{opacity:.55}
.live-act.done .a-ico{background:#16a34a}
.live-act.fail{opacity:.7}
.live-act.fail .a-ico{background:var(--err-tx)}
.live-act .a-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes a-pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* ============ 欢迎页 ============ */
.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px 6vh}
.welcome .wlogo{
  width:64px;height:64px;border-radius:20px;margin-bottom:20px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 40px rgba(76,125,255,.35);
}
.welcome .wlogo svg{width:30px;height:30px}
.welcome h2{font-size:22px;font-weight:700;margin-bottom:8px}
.welcome p{color:var(--text2);font-size:14px;max-width:460px;line-height:1.7}
.suggests{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;width:100%;max-width:640px;margin-top:30px;
}
.sugg{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:13px 15px;text-align:left;cursor:pointer;transition:.18s;color:var(--text);
  font-family:var(--font);font-size:13px;line-height:1.6;
}
.sugg:hover{
  border-color:var(--accent1);transform:translateY(-2px);
  box-shadow:0 10px 24px var(--glow);
}
.sugg b{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:3px}
.sugg span{color:var(--text2);font-size:12px}
/* ============ 输入区 ============ */
.composer-wrap{flex:none;padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
/* 附件条：输入框上方的小框（缩略图/文件名 + 上传进度 + 移除叉），不占用输入框文本 */
.attach-bar{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px 9px}
.attach-chip{
  position:relative;width:58px;height:58px;flex:none;border-radius:13px;overflow:hidden;
  border:1px solid var(--border-strong);background:var(--bubble);
}
.attach-chip img{width:100%;height:100%;object-fit:cover;display:block}
.attach-chip .ico{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.4px;
  background:linear-gradient(135deg,var(--bubble),var(--panel-solid));
}
.attach-chip .pg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:#fff;background:rgba(12,16,28,.55);
}
.attach-chip.done .pg{display:none}
.attach-chip.fail{border-color:#ff5b5b}
.attach-chip.fail .pg{background:rgba(120,20,20,.62)}
.attach-chip .bar{
  position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent1);
  transition:width .15s ease;
}
.attach-chip.done .bar{display:none}
.attach-chip.fail .bar{background:#ff5b5b}
.attach-chip .x{
  position:absolute;top:2px;right:2px;width:18px;height:18px;padding:0;border:none;
  border-radius:50%;cursor:pointer;font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:rgba(14,18,30,.72);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.attach-chip .x:hover{background:#ff5b5b}
.attach-chip .x::after{content:'';position:absolute;inset:-7px}  /* 手机上扩大点击热区 */
.composer{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--panel-solid);border:1px solid var(--border-strong);
  border-radius:20px;padding:9px 9px 9px 16px;
  box-shadow:var(--shadow);
  transition:border-color .18s;
}
.composer:focus-within{border-color:var(--accent1);box-shadow:0 0 0 3px var(--glow),var(--shadow)}
#inputBox{
  flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--text);
  font-family:var(--font);font-size:15px;line-height:1.6;max-height:160px;padding:7px 0;
}
#inputBox::placeholder{color:var(--text3)}
#sendBtn{
  width:42px;height:42px;flex:none;border:none;border-radius:14px;cursor:pointer;
  background:var(--user-grad);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:.18s;box-shadow:0 6px 16px rgba(76,125,255,.3);
}
#sendBtn:hover{transform:translateY(-1px);filter:brightness(1.08)}
#sendBtn:active{transform:scale(.95)}
#sendBtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
#sendBtn svg{width:18px;height:18px}
#plusBtn{
  width:42px;height:42px;flex:none;cursor:pointer;
  border:1px solid var(--border-strong);border-radius:14px;background:var(--bubble);
  color:var(--text2);display:flex;align-items:center;justify-content:center;transition:.18s;
}
#plusBtn:hover{color:var(--accent1);border-color:var(--accent1);transform:translateY(-1px)}
#plusBtn:active{transform:scale(.95)}
#plusBtn svg{width:19px;height:19px}
#plusBtn.busy{opacity:.5;pointer-events:none}
.composer.dragover{border-color:var(--accent1);box-shadow:0 0 0 3px var(--glow),var(--shadow)}
.hint{text-align:center;font-size:11px;color:var(--text3);margin-top:8px}
/* ============ 移动端 ============ */
button{touch-action:manipulation} /* 移动端消除双击缩放延迟 */
@media (max-width:600px){
  /* 左右留出刘海/挖孔的安全区，横屏时头像一个都不会被遮住 */
  .app{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  header{padding:9px 2px;gap:8px}
  .brand{gap:8px}
  .brand>div{min-width:0}
  .brand h1{font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
  .logo{width:29px;height:29px;border-radius:9px}
  .logo svg{width:15px;height:15px}
  .tools{display:none} /* 手机上整行工具标签都隐藏，省掉 6px 上边距 */
  .hbtns{gap:4px}
  .hbtn{width:30px;height:30px;border-radius:9px}
  .hbtn svg{width:15px;height:15px}
  #chatBox{padding:14px 6px 10px 0} /* 移动端系统滚动条贴边，无需留白 */
  .msg{gap:8px;margin-bottom:16px}
  .avatar{width:27px;height:27px;border-radius:8px}
  .avatar svg{width:13px;height:13px}
  .time{font-size:10px}
  .bubble{font-size:14px;padding:10px 13px;line-height:1.7}
  .bubble h1{font-size:17px}.bubble h2{font-size:15.5px}
  .bubble pre{padding:10px 12px;border-radius:10px}
  .bubble pre code{font-size:12px}
  .welcome{padding:0 4px 3vh}
  .welcome .wlogo{width:52px;height:52px;border-radius:15px;margin-bottom:14px}
  .welcome .wlogo svg{width:24px;height:24px}
  .welcome h2{font-size:19px}
  .welcome p{font-size:13px}
  .suggests{gap:8px;margin-top:20px;grid-template-columns:1fr 1fr}
  .sugg{padding:11px 12px;border-radius:12px}
  .sugg b{font-size:12.5px}
  .sugg span{font-size:11px}
  .composer-wrap{padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
  .composer{border-radius:18px;padding:6px 6px 6px 13px;gap:6px}
  #inputBox{font-size:16px;line-height:1.45;padding:9px 0} /* ≥16px 防 iOS 聚焦时页面自动放大 */
  #inputBox::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sendBtn{width:38px;height:38px;border-radius:12px}
  #plusBtn{width:38px;height:38px;border-radius:12px}
  .wsbar{gap:6px;padding:0 2px 8px}
  /* 移动端隐藏“本机工作空间”按钮（File System Access 仅桌面浏览器支持），但保留模型选择 */
  .wsbar .ws-anchor{display:none!important}
  .mbtn,.gbtn{height:29px;padding:0 9px;font-size:11.5px}
  .mbtn .txt,.gbtn .txt{max-width:104px}
  .hint{display:none}
  .auth-overlay{padding:14px}
  .auth-card{padding:28px 22px 22px}
}
/* 超窄屏：建议卡退化为单列 */
@media (max-width:380px){
  .suggests{grid-template-columns:1fr}
  .brand h1{font-size:13.5px}
  .user-badge{max-width:54px}
  .hbtn{width:29px;height:29px}
  .hbtns{gap:3px}
}
/* ============ 登录层 ============ */
.auth-overlay{

}
.auth-logo{

}
.auth-logo svg{width:27px;height:27px}
.auth-card h2{font-size:19px;margin-bottom:7px}
.auth-card .auth-sub{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.65}
.auth-input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border-strong);
  background:var(--bubble);color:var(--text);font-size:14.5px;outline:none;
  transition:.18s;margin-bottom:6px;
}
.auth-input::placeholder{color:var(--text3)}
.auth-input:focus{border-color:var(--accent1);box-shadow:0 0 0 3px var(--glow)}
.auth-btn{
  width:100%;padding:12px;border:none;border-radius:12px;cursor:pointer;
  background:var(--user-grad);color:#fff;font-size:15px;font-weight:600;letter-spacing:2px;
  transition:.18s;margin-top:14px;
}
.auth-btn:hover{opacity:.92;transform:translateY(-1px)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.shake{animation:shake .5s ease}

/* ============ 更新说明弹窗 ============ */
.upd-overlay{

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>

      </button>

    <p class="hint">AI 生成内容仅供参考，请核查重要信息</p>

</div>

<script>
/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const chatBox = $('#chatBox'), inputBox = $('#inputBox'), sendBtn = $('#sendBtn');
/* 输入框提示语：宽屏显示完整说明；窄屏只留短句，避免 placeholder 折行把输入框挤成两行 */
const PH_WIDE='输入你的问题…（Enter 发送，Shift+Enter 换行）', PH_NARROW='输入你的问题…';
function syncPlaceholder(){
  const ph = window.innerWidth<=600 ? PH_NARROW : PH_WIDE;
  if(inputBox && inputBox.placeholder!==ph) inputBox.placeholder=ph;
}
syncPlaceholder();
let phTimer=0;
window.addEventListener('resize',()=>{clearTimeout(phTimer);phTimer=setTimeout(syncPlaceholder,150)},{passive:true});
const THEME_KEY = 'mcp-theme';
const TOKEN_KEY = 'mcp-auth-token';
let authToken='', me={name:'',isAdmin:false,serverRoot:''};
let myUserRoot='';   // 当前用户工作空间绝对路径，用于把回答里的文件路径变成下载链接
let wsMode='local';  // 'local'=个人工作空间 / 'server'=云服务器代码目录(仅管理员)
try{authToken=localStorage.getItem(TOKEN_KEY)||''}catch(e){}
const authOverlay=$('#authOverlay'), authUser=$('#authUser'), authPwd=$('#authPwd'),
      authInvite=$('#authInvite'), authErr=$('#authErr'), authLoginBtn=$('#authLoginBtn');
const userBadge=$('#userBadge');
function updateUserBadge(){
  if(!userBadge)return;
  if(me&&me.name){userBadge.textContent=me.name;userBadge.hidden=false}
  else userBadge.hidden=true;
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

/* ================= 极简 Markdown 渲染 ================= */
function mdInline(s){
  const toks=[];
  // 行内代码保护
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>{toks.push('<code>'+c+'</code>');return '\u0000T'+(toks.length-1)+'\u0000'});
  // 链接
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 删除线
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  // 粗体
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // 斜体
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/__([^_]+)__/g,'<em>$1</em>');
  // 还原代码 token
  s=s.replace(/\u0000T(\d+)\u0000/g,(m,i)=>toks[+i]);
  return s;
}
/* 表格辅助：切分一行单元格 / 判断分隔行 */
function splitRow(line){
  let s=line.trim();
  if(s.startsWith('|'))s=s.slice(1);
  if(s.endsWith('|'))s=s.slice(0,-1);
  return s.split('|').map(c=>c.trim());
}
function isTableSep(line){
  const cells=splitRow(line);
  return cells.length>0 && cells.every(c=>/^:?-+:?$/.test(c));
}
function renderMarkdown(src){
  src=esc(src);
  const blocks=[];
  src=src.replace(/```([\w+#.-]*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<pre><code class="lang-'+lang+'">'+code.replace(/\n$/,'')+'</code></pre>');
    return '\u0000B'+(blocks.length-1)+'\u0000';
  });
  const lines=src.split('\n');
  let out='', para=[], i=0;
  const flush=()=>{if(para.length){out+='<p>'+mdInline(para.join(' '))+'</p>';para=[]}};
  while(i<lines.length){
    const line=lines[i];
    if(line.trim()===''){flush();i++;continue}
    // 代码块
    const cb=line.match(/^\u0000B(\d+)\u0000$/);
    if(cb){flush();out+=blocks[+cb[1]];i++;continue}
    // 分隔线
    if(/^([-*_])\1{2,}$/.test(line.trim())){flush();out+='<hr>';i++;continue}
    // 表格：表头行(以|开头) + 分隔行(|---|---| 或 |--:|:-:| 等)
    if(/^\s*\|/.test(line) && i+1<lines.length && isTableSep(lines[i+1])){
      flush();
      const head=splitRow(line);
      const align=splitRow(lines[i+1]).map(c=>{
        const l=c.startsWith(':'),r=c.endsWith(':');
        return l&&r?'center':r?'right':l?'left':'';
      });
      i+=2;
      const cell=(c,ci,tag)=>{
        const a=align[ci]?' style="text-align:'+align[ci]+'"':'';
        return '<'+tag+a+'>'+mdInline(c)+'</'+tag+'>';
      };
      let tbl='<div class="tblwrap"><table><thead><tr>'+
        head.map((c,ci)=>cell(c,ci,'th')).join('')+'</tr></thead><tbody>';
      while(i<lines.length && /^\s*\|/.test(lines[i])){
        const cells=splitRow(lines[i]);
        while(cells.length<head.length)cells.push('');
        tbl+='<tr>'+cells.slice(0,head.length).map((c,ci)=>cell(c,ci,'td')).join('')+'</tr>';
        i++;
      }
      tbl+='</tbody></table></div>';
      out+=tbl;continue;
    }
    // 标题
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){flush();const n=h[1].length;out+='<h'+n+'>'+mdInline(h[2])+'</h'+n+'>';i++;continue}
    // 引用
    if(/^&gt;\s?/.test(line)){
      flush();const q=[];
      while(i<lines.length && /^&gt;\s?/.test(lines[i])){q.push(mdInline(lines[i].replace(/^&gt;\s?/,'')));i++}
      out+='<blockquote>'+q.join('<br>')+'</blockquote>';continue;
    }
    // 无序列表
    const ul=line.match(/^[-*+]\s+(.*)$/);
    if(ul){
      flush();const items=[mdInline(ul[1])];i++;
      while(i<lines.length){const m=lines[i].match(/^[-*+]\s+(.*)$/);if(m){items.push(mdInline(m[1]));i++}else break}
      out+='<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';continue;
    }
    // 有序列表
    const ol=line.match(/^\d+[.、)]\s+(.*)$/);
    if(ol){
      flush();const items=[mdInline(ol[1])];i++;
      while(i<lines.length){const m=lines[i].match(/^\d+[.、)]\s+(.*)$/);if(m){items.push(mdInline(m[1]));i++}else break}
      out+='<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>';continue;
    }
    para.push(line);i++;
  }
  flush();
  return out.replace(/\u0000B(\d+)\u0000/g,(m,i)=>blocks[+i]);
}

// 把渲染后的 HTML 中出现的"本用户工作空间绝对路径"变成可点击的下载链接
function linkifyUserFiles(html){
  if(!html)return html;
  const root=myUserRoot?esc(myUserRoot.replace(/\/+$/,'')).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'):null;
  // 生成下载卡片；失败返回 null（调用方保留原文）
  const mk=(rel)=>{
    // 去掉结尾被顺带吸进来的常见标点/括号
    let clean=rel.replace(/[，。、；：,.!?;:'")\]}>】》]+$/,'');
    // AI 有时把产出文件写成沙箱内绝对路径(如 /home/admin/fs_workspace/users/u1_xxx/a.docx)。
    // 后端 /api/files/download 的语义是"相对用户沙箱根"，直接把绝对路径去掉一个 "/" 会拼出
    // <沙箱>/home/admin/fs_workspace/... → 404 文件不存在。这里先归一化成相对沙箱根的路径。
    const ROOT=(myUserRoot||'').replace(/\/+$/,'');
    if(ROOT&&clean.startsWith(ROOT))clean=clean.slice(ROOT.length);
    while(clean.startsWith('/'))clean=clean.slice(1);
    if(!clean||clean==='/')return null;
    const name=decodeURIComponent(clean.split('/').pop());
    // 最后一段没有扩展名 → 大概率是目录(如"查看工作目录"回复的路径),不做下载链接
    if(!name.includes('.'))return null;
    // 下载走新标签页直接导航，无法带 Authorization 头 → 把 token 拼进查询参数让后端认
    const href='/api/files/download?path='+encodeURIComponent(clean)+
      '&token='+encodeURIComponent(authToken);
    // 按扩展名着色的文件类型徽标 + 文件名 + 下载箭头
    const ext=(name.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
    const ico=ext&&ext!==name.toLowerCase().replace('.','')?esc(ext.toUpperCase()):'FILE';
    return '<a class="filedl ext-'+esc(ext||'bin')+'" href="'+href+'" target="_blank" rel="noopener" title="点击保存到你的设备">'+
      '<span class="f-ico">'+ico+'</span><span class="f-name">'+esc(name)+'</span><span class="f-dl">↓</span></a>';
  };
  // ① 上传引用标记([图片: 路径]/[文件: 路径]) → 直接变成下载卡片, 连外壳一起去掉。
  //    路径可能被 AI 包进反引号(渲染成 <code>…</code>) → 必须连 code 外壳一起替换,
  //    否则 code 的背景/边框会在卡片两侧露出长条
  html=html.replace(/<code>\s*(?:\[(?:图片|文件|附件):\s*([^\]]+?)\s*\]|(_uploads\/[^<]*?))\s*<\/code>/g,
    (m,mk1,up)=>{const c=mk(mk1||up);return c||m});
  html=html.replace(/\[(?:图片|文件|附件):\s*([^\]]+?)\s*\]/g,(m,rel)=>mk(rel)||m);
  // ② 用户上传的附件相对路径 _uploads/xxx 的裸路径兜底
  html=html.replace(/(^|[\s（(>：:，,、])(_uploads\/[^\s<>"'`\[\]]+)/g,(m,p1,rel)=>{const c=mk(rel);return c?(p1+c):m});
  if(!root)return html;
  // 路径被 AI 包进反引号时,渲染成 <code>路径</code> —— 必须连外壳一起替换,
  // 否则 code 的背景/边框会在卡片两侧露出长条
  html=html.replace(new RegExp('<code>\\s*('+root+'[^<]*?)\\s*</code>','g'),(m,rel)=>mk(rel)||m);
  // 裸路径兜底
  html=html.replace(new RegExp(root+'(/[^\\s<>"\'`]+)','g'),(m,rel)=>mk(rel)||m);
  return html;
}

/* ================= 消息管理 ================= */
let history=[];   // {role:'user'|'assistant'|'error'|'loading', text, ts?}
let busy=false, controller=null;

// 显示用的时刻：历史消息显示其真实时间，当场新消息显示当前时间
function fmtHM(ts){
  if(!ts)return now();
  const d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// 【唯一的用户上下文填充入口】/api/me 是权威来源。
// 历史 bug：doAuth(点登录按钮) 只填了 me.name，漏了 isAdmin/serverRoot，
// 导致重启后重新登录的用户看不到「云服务器」工作空间入口。所有登录/启动路径都必须走这里。
function applyMe(d){
  if(!d)return;
  if(d.username)me.name=d.username;
  me.isAdmin=!!d.is_admin;
  me.serverRoot=d.server_root||'';
  if(d.user_root)myUserRoot=d.user_root;
  if(d.ws_mode)wsMode=d.ws_mode;
}
// 主动拉一次 /api/me 并套用（登录后必须调用：/api/auth 不返回 is_admin/server_root）
async function refreshMe(){
  try{
    const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+authToken}});
    if(!r.ok)return false;
    applyMe(await r.json());
    return true;
  }catch(e){return false}
}

// 从服务端拉取“当前用户自己的”历史消息（按用户隔离）
async function loadServerHistory(doRender=true){
  try{
    const r=await fetch('/api/history',{headers:{'Authorization':'Bearer '+authToken}});
    if(!r.ok){throw new Error('HTTP '+r.status)}
    const d=await r.json();
    if(d&&d.username)me.name=d.username;
    if(d&&d.user_root)myUserRoot=d.user_root;
    if(d&&d.ws_mode)wsMode=d.ws_mode;
    history=(d&&Array.isArray(d.messages)?d.messages:[])
      .filter(m=>m&&(m.role==='user'||m.role==='assistant'))
      .map(m=>({role:m.role,text:m.text,ts:m.ts,model:m.model||'',
                id:m.id,interrupted:m.interrupted?1:0}));
  }catch(e){
    if(doRender)history=[];
  }
  updateUserBadge();
  if(doRender)renderAll();
  return true;
}

const STAR='<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z" fill="#fff"/></svg>';

function renderAll(){
  chatBox.innerHTML='';
  if(!history.length){showWelcome();return}
  history.forEach(item=>chatBox.appendChild(buildMsg(item)));
  scrollBottom();
}
/* 用量小字：⚡缓存命中 96%（4.2k/4.4k tok）· 输出 131 tok · 2 轮 */
function fmtUsage(u){
  const hit=u.hit||0,miss=u.miss||0,out=u.out||0;
  const tot=hit+miss,pct=tot?Math.round(hit*100/tot):100;
  const k=n=>n>=10000?(Math.round(n/100)/10)+'k':(n>=1000?(Math.round(n/100)/10)+'k':''+n);
  let s='⚡ 缓存命中 '+pct+'%';
  if(tot)s+='（'+k(hit)+'/'+k(tot)+' tok）';
  if(out)s+=' · 输出 '+k(out)+' tok';
  if(u.rounds>1)s+=' · '+u.rounds+' 轮';
  return s;
}
function buildMsg(item){
  const wrap=document.createElement('div');
  if(item.role==='user'){
    wrap.className='msg user';
    wrap.innerHTML='<div class="col"><div class="time">'+fmtHM(item.ts)+'</div><div class="bubble">'+esc(item.text)+'</div></div>';
  }else{
    wrap.className='msg bot';
    if(item.role==='loading')wrap.id='loadingMsg'; // 标记 loading 气泡，便于回复后从 DOM 移除
    let body;
    if(item.role==='loading'){
      body='<div class="bubble"><div class="typing"><span class="dots"><i></i><i></i><i></i></span><span style="color:var(--text2);font-size:13px">正在思考并调用工具…</span>'+
           '<button class="stop-btn" id="stopBtn">⏹ 停止</button></div></div>';
    }else if(item.role==='error'){
      body='<div class="bubble err">'+esc(item.text)+'</div>';
    }else{
      body='<div class="bubble">'+linkifyUserFiles(renderMarkdown(item.text))+'</div>';
    }
    const mchip=(item.role==='assistant'&&item.model)
      ? '<div class="msg-model"><span class="mm-dot"></span>'+esc(item.model)+'</div>' : '';
    const uchip=(item.role==='assistant'&&item.usage&&(item.usage.in||item.usage.out))
      ? '<div class="msg-usage">'+fmtUsage(item.usage)+'</div>' : '';
    // 上一轮没答完（断网/关页面/手动停）→ 气泡下挂一个「继续」按钮
    const cbtn=(item.role==='assistant'&&item.interrupted)
      ? '<div class="cont-row"><button class="cont-btn" type="button">▶ 继续生成</button>'+
        '<span class="cont-hint">上次没答完，从这里接着写</span></div>' : '';
    wrap.innerHTML='<div class="avatar">'+STAR+'</div><div class="col"><div class="time">'+fmtHM(item.ts)+'</div>'+body+cbtn+mchip+uchip+'</div>';
    if(cbtn){
      const cb=wrap.querySelector('.cont-btn');
      if(cb)cb.onclick=()=>continueFrom(item,wrap);
    }
  }
  return wrap;
}
function push(item){history.push(item);chatBox.appendChild(buildMsg(item));scrollBottom()}
function removeLoading(){
  // loading 仅是视觉态，不入 history；只删 DOM
  const el=document.getElementById('loadingMsg');
  if(el)el.remove();
}
function insertLoading(){
  chatBox.appendChild(buildMsg({role:'loading',text:''}));
  scrollBottom();
}
/* ================= 粘底引擎（stick-to-bottom） =================
   三条原则：
   1) 贴底一律直接赋值 scrollTop，不做平滑动画 —— 流式期间每帧都要真的到底；
   2) 「是否跟随」由用户手势决定，不用 scrollTop 反推 —— 否则流式输出时位置稍有
      滞后就会被误判成"用户往上翻了"，从而永久停止跟随（原 bug）；
   3) 用 rAF 合并同一帧内的多次贴底请求，避免每个 delta 都触发一次布局。 */
let stick=true;          // 是否自动跟随最新内容
let stickRaf=0;          // 同帧贴底请求合并标志
let lastUserGesture=0;   // 最近一次用户主动滚动的时间戳

const BOTTOM_SLACK=72;   // 距底部多少像素以内算"贴底"
function distToBottom(){return chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight}
function isAtBottom(slack){return distToBottom()<=(slack==null?BOTTOM_SLACK:slack)}

// 立即贴底（发送、新增消息、点回到底部时用）
function scrollToBottomNow(){
  stick=true;
  if(stickRaf){cancelAnimationFrame(stickRaf);stickRaf=0}
  chatBox.scrollTop=chatBox.scrollHeight;
  syncJumpBtn();
}
// 本帧末贴底（流式增量时用，若仍处于跟随状态）
function stickToBottom(){
  if(!stick||stickRaf)return;
  stickRaf=requestAnimationFrame(()=>{
    stickRaf=0;
    if(stick){chatBox.scrollTop=chatBox.scrollHeight;syncJumpBtn()}
  });
}
// 兼容历史调用名
function scrollBottom(){scrollToBottomNow()}
function scrollKeep(){stickToBottom()}
function pinnedToBottom(){return stick&&isAtBottom()}

function noteUserGesture(){lastUserGesture=performance.now()}
['wheel','touchstart','touchmove','pointerdown','mousedown'].forEach(ev=>
  chatBox.addEventListener(ev,noteUserGesture,{passive:true}));
chatBox.addEventListener('keydown',noteUserGesture,true);

// 「↓ 新内容」按钮
const jumpBtn=$('#jumpBtn');
function syncJumpBtn(){
  if(!jumpBtn)return;
  if(stick&&isAtBottom())jumpBtn.classList.remove('show');
  else jumpBtn.classList.add('show');
}
if(jumpBtn)jumpBtn.onclick=()=>{scrollToBottomNow();updateScrollInd()};

// 内容异步变高（图片解码、表格/代码块渲染完成）也要继续跟随
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>{if(stick)stickToBottom()});
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType===1)ro.observe(n);
  }))).observe(chatBox,{childList:true});
  ro.observe(chatBox);
}

/* ================= 自绘"米粒"滚动指示条 ================= */
const scrollInd=$('#scrollInd');
let indTimer=null;
function updateScrollInd(){
  if(!scrollInd)return;
  const maxScroll=chatBox.scrollHeight-chatBox.clientHeight;
  const rect=chatBox.getBoundingClientRect();
  const appRect=chatBox.parentElement.getBoundingClientRect();
  const trackH=rect.height;
  const th=Math.max(16,Math.min(32,trackH*0.08)); // 拇指高度：一粒米大小(16~32px)
  scrollInd.style.height=th+'px';
  const ratio=maxScroll>0?chatBox.scrollTop/maxScroll:0;
  scrollInd.style.top=(rect.top-appRect.top+ratio*(trackH-th))+'px';
  scrollInd.classList.add('show');
  clearTimeout(indTimer);
  indTimer=setTimeout(()=>scrollInd.classList.remove('show'),900);
}
chatBox.addEventListener('scroll',()=>{
  // 只在"用户自己动的"滚动上重新判定跟随状态，程序化贴底不会误伤
  if(performance.now()-lastUserGesture<700)stick=isAtBottom(24);
  updateScrollInd();
  syncJumpBtn();
},{passive:true});
window.addEventListener('resize',updateScrollInd);

/* ================= 发送逻辑（SSE 流式） ================= */
let liveMsgEl=null,liveBubbleEl=null,liveTextNode=null;
let liveActLines={}; // 工具名 -> 最近一条动作行元素（完成时更新 / 同名重试收尾）
let curRun=null;     // 当前「连续同名工具调用」合并组：{name,el,count,notes,closed}
function liveCleanup(){
  liveMsgEl=null;liveBubbleEl=null;liveTextNode=null;liveActLines={};curRun=null;
}
/* 粘底相关函数已集中到上方「粘底引擎」，此处不再重复定义 */
function ensureLiveMsg(){
  liveMsgEl=document.createElement('div');liveMsgEl.className='msg bot';liveMsgEl.id='liveMsg';
  liveMsgEl.innerHTML='<div class="avatar">'+STAR+'</div><div class="col">'+
    '<div class="live-top"><div class="time">'+now()+'</div>'+
    '<span class="live-status" id="liveStatus"><i class="ls-dot"></i>正在回答</span>'+
    '<button class="stop-mini" id="liveStop" title="停止生成">⏹ 停止</button></div>'+
    '<div class="bubble live" id="liveBubble"></div></div>';
  chatBox.appendChild(liveMsgEl);
  liveBubbleEl=liveMsgEl.querySelector('#liveBubble');
  // 占位也放进文本节点流，保证正文/工具行能与它正确衔接
  liveTextNode=document.createTextNode('⏳ 正在思考…');
  liveBubbleEl.appendChild(liveTextNode);
  liveMsgEl.querySelector('#liveStop').onclick=()=>controller&&controller.abort();
  scrollToBottomNow(); // 直播间一出现就贴底，别让用户以为没反应
}
// 工具名 -> 中文短名（未收录则显示原名）

  edit_file:'修改文件',search_files:'搜索文件',get_file_info:'查看文件信息',
  directory_tree:'查看目录树',read_multiple_files:'批量读取文件',
  create_directory:'新建目录',move_file:'移动文件',copy_file:'复制文件',
  delete_file:'删除文件',run_command:'执行终端命令',
  user_filesystem:'读写本机文件',
  // 真实工具名（此前缺映射，界面直接暴露英文名，看不出在干什么）
  search:'联网搜索',search_nearby:'搜索周边',locate_ip:'定位位置',regeo:'地址解析',
  fetchWebContent:'抓取网页',fetchCsdnArticle:'读 CSDN 文章',fetchGithubReadme:'读 GitHub 说明',
  fetchJuejinArticle:'读掘金文章',fetchLinuxDoArticle:'读 LinuxDo 帖',
  terminal_run:'执行命令',terminal_session_list:'列出终端会话',terminal_type:'输入命令',
  terminal_read_output:'读取终端输出',terminal_press_key:'终端按键',
  terminal_snapshot:'读取终端画面',terminal_session_close:'关闭终端会话',
  terminal_click:'终端点击',terminal_wait_for:'等待终端输出',terminal_session_resize:'调整终端尺寸',

function toolLabel(name){
  const t=String(name||'');
  if(t.startsWith('amap_'))return '地图·'+t.slice(5);
  if(TOOL_LABEL[t])return TOOL_LABEL[t];
  return t;
}
// 追加一段流式正文（始终在"当前文本段"的文本节点上续写）
function liveAppend(s){
  if(!liveTextNode){
    liveTextNode=document.createTextNode(s);liveBubbleEl.appendChild(liveTextNode);
  }else if(liveTextNode.data==='⏳ 正在思考…'){
    liveTextNode.data=s; // 占位直接转正文
  }else{
    liveTextNode.appendData(s);
  }
}
// 结束当前文本段：之后的正文会从工具行下方另起一段
function liveBreakSegment(){
  if(liveTextNode&&liveTextNode.data==='⏳ 正在思考…'){liveTextNode.remove();liveTextNode=null;}
  liveTextNode=null;
}
// 在当前文本段正下方插入一条"正在执行"的工具行
function addLiveToolLine(name){
  const line=document.createElement('div');line.className='live-act run';
  line.innerHTML='<span class="a-ico"></span><span class="a-txt"></span>';
  liveBubbleEl.appendChild(line);
  const label=toolLabel(name);
  line.dataset.label=label;
  line.querySelector('.a-txt').textContent='正在执行 '+label+' …';
  return line;
}
// 工具行收尾：成功打勾变淡只留工具名，失败打叉带提示
function settleLiveToolLine(line,ok,note){
  if(!line)return;
  line.className='live-act '+(ok?'done':'fail');
  line.querySelector('.a-ico').textContent=ok?'✓':'✕';
  line.querySelector('.a-txt').textContent=ok?(line.dataset.label||''):('失败：'+(line.dataset.label||''));
  if(note)line.title=note;
}
// ============ 连续同名工具调用合并成一行（「搜索 ×4」） ============
// 模型常拿同一个词反复搜（实测一屏里 search ×4、fetchWebContent ×3），以前一行一个，
// 把回答挤得看不见。这里把**连续的**同名调用合并成一行并标次数，点一下可展开每次参数。
// 注意：合并只是少画几行，**省不了 token**；真正省 token 的是后端「同名同参数短路」。
function applyRunText(run,phase){
  const label=toolLabel(run.name);
  const n=run.count>1?(' ×'+run.count):'';
  const txt=run.el.querySelector('.a-txt');
  if(!txt)return;
  // count>1 时不能直接写「失败：X ×N」——前面几次可能是成功的，只标「最后一次失败」
  if(phase==='fail')txt.textContent=run.count>1?(label+n+' · 最后一次失败'):('失败：'+label);
  else if(phase==='done')txt.textContent=label+n;
  else txt.textContent='正在执行 '+label+n+' …';
}
function bumpToolRun(run,note){
  run.count+=1;
  if(note)run.notes.push(note);
  // 上一次已收尾（打勾）后又来了同名的下一次：重新标回「进行中」。否则后续的 ok/error
  // 会被 sealToolRun 里的 closed 判断挡掉，文案永远停在「正在执行…」（测试抓出来的）
  if(run.closed){run.closed=false;run.el.className='live-act run';}
  applyRunText(run,'running');
}
function sealToolRun(run,phase){
  if(!run||run.closed)return;
  run.closed=true;
  if(phase==='fail')run.failed=true;
  run.el.className='live-act '+(phase==='fail'?'fail':'done');
  const ico=run.el.querySelector('.a-ico');
  if(ico)ico.textContent=phase==='fail'?'✕':'✓';
  applyRunText(run,phase);
  if(run.count>1)attachRunDetail(run);
}
function attachRunDetail(run){
  if(run.detailEl||!run.el.parentNode)return;
  const d=document.createElement('div');
  d.style.cssText='display:none;margin:2px 0 6px 22px;font-size:11.5px;color:var(--text3);'+
    'line-height:1.7;white-space:pre-wrap;word-break:break-all';
  d.textContent=run.notes.map((n,i)=>{
    const last=(i===run.notes.length-1)&&run.failed;
    return '#'+(i+1)+'  '+(n||'(无参数)')+(last?'   ← 失败':'');
  }).join('\n');
  run.el.parentNode.insertBefore(d,run.el.nextSibling);
  run.detailEl=d;
  run.el.style.cursor='pointer';
  run.el.title='点击展开／收起每次调用的参数';
  run.el.onclick=()=>{d.style.display=d.style.display==='none'?'block':'none'};
}
function finishLiveStream(item){
  // 用正式渲染替换直播节点，并写入页面历史（服务端已完成持久化，无需本地保存）
  const fresh=buildMsg(item);
  if(liveMsgEl)liveMsgEl.replaceWith(fresh);
  liveCleanup();
  history.push(item);scrollKeep();
}
/* 「继续」：接着这条没写完的回答往下写。
   服务端拿 partial 作为断点锚点让模型接着写，完成后把新内容接在原文后回写同一条记录
   （历史不新增条目），所以这里也只就地重建这一个气泡。 */
async function continueFrom(msg,wrapEl){
  if(busy||!msg||!msg.id)return;
  const bubble=wrapEl.querySelector('.bubble');
  if(!bubble)return;
  busy=true;sendBtn.disabled=true;controller=new AbortController();
  const btn=wrapEl.querySelector('.cont-btn');
  if(btn){btn.disabled=true;btn.textContent='续写中…'}
  const base=msg.text||'';
  let tail='',answeredModel='',lastUsage=null;
  bubble.classList.add('live');
  bubble.textContent=base;                    // 先按纯文本连续追加，结束时再统一渲染
  const tspan=document.createElement('span');
  tspan.className='cont-live';
  bubble.appendChild(tspan);
  const rebuild=()=>{
    const item={role:'assistant',text:base.trim()+(tail.trim()?'\n\n'+tail.trim():''),ts:msg.ts,
                model:msg.model||answeredModel,usage:lastUsage||msg.usage,
                id:msg.id,interrupted:msg.interrupted};
    const fresh=buildMsg(item);
    wrapEl.replaceWith(fresh);
    Object.assign(msg,item);
    scrollKeep();
  };
  let actTimer=null;   // 必须在 try 外声明：finally 里要 clearInterval
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
      body:JSON.stringify({query:'继续',model:modelKey,continue_msg_id:msg.id}),
      signal:controller.signal
    });
    if(resp.status===401)throw new Error('登录已过期，请刷新页面重新登录');
    if(!resp.ok||!resp.body)throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader();const dec=new TextDecoder();
    let bf='',completed=false;
    // 续写途中模型可能先「去做事」（调工具）——这类事件过去在这里被完全丢掉，
    // 于是界面长时间一动不动，用户就以为「点了没反应」。
    // 这里维护一行活动状态，把它在干什么实时显示出来。
    let actEl=null,actBase='',actAt=0;
    const setAct=t=>{
      actBase=t;actAt=Date.now();
      if(!actEl){actEl=document.createElement('div');actEl.className='cont-act';bubble.appendChild(actEl)}
      actEl.textContent=t;scrollKeep();
    };
    actTimer=setInterval(()=>{
      if(!actEl||!actAt)return;
      const s=Math.floor((Date.now()-actAt)/1000);
      if(s>=8)actEl.textContent=actBase+'（已等待 '+s+' 秒）';
    },1000);
    setAct('⏳ 正在续写，请稍候…');
    while(true){
      const{value,done}=await reader.read();if(done)break;
      bf+=dec.decode(value,{stream:true});
      const parts=bf.split('\n\n');bf=parts.pop();
      for(const raw of parts){
        const line=raw.trim();if(!line.startsWith('data:'))continue;
        const payload=line.slice(5).trim();if(!payload)continue;
        let ev=null;try{ev=JSON.parse(payload)}catch(e){continue}
        if(ev.type==='answer'&&ev.delta){tail+=ev.delta;tspan.textContent=tail;scrollKeep();}
        else if(ev.type==='tool'&&ev.name){
          const nm=TOOL_LABEL[ev.name]||ev.name;
          if(ev.status==='ok')setAct('✅ '+nm+' 完成');
          else if(ev.status==='fail')setAct('⚠️ '+nm+' 失败');
          else setAct('🔧 '+nm+'…');
        }else if(ev.type==='done'){
          if(ev.answer!==undefined&&!tail)tail=ev.answer;
          if(ev.model_key)answeredModel=modelLabel(ev.model_key);
          if(ev.usage&&(ev.usage.in||ev.usage.out))lastUsage=ev.usage;
          completed=true;
        }else if(ev.type==='error'){throw new Error(ev.message||'服务端流式错误');}
      }
      if(completed)break;
    }
    if(tail.trim())msg.interrupted=0;   // 确实续上了才算写完；没输出则保留按钮
    rebuild();
  }catch(err){
    // 续写途中又断了：已续上的部分保留，按钮重新挂回，服务端也已将半截回写
    msg.interrupted=1;
    rebuild();
    if(err&&err.name==='AbortError')toast('已停止续写');
    else toast('续写中断：'+netErrMsg(err));
  }finally{
    clearInterval(actTimer);
    busy=false;sendBtn.disabled=false;controller=null;
  }
}
/* 断线后确认服务端是否已存下半截（存了就会返回 interrupted=1）→ 重绘出「继续」按钮 */
async function confirmInterrupted(tries=4){
  for(let i=0;i<tries;i++){
    await new Promise(r=>setTimeout(r,700));
    await loadServerHistory(false);   // 只更新数据不重绘，避免把本地刚显示的内容闪掉
    if(history.length&&history[history.length-1].interrupted){renderAll();return true}
  }
  return false;
}
/* 网络类错误的友好文案：iOS Safari 断流报 "Load failed"，桌面报 "Failed to fetch" */
function netErrMsg(err){
  const m=(err&&err.message)?String(err.message):'未知错误';
  if(/Load failed|Failed to fetch|NetworkError|network connection was lost|The Internet connection|net::/i.test(m))
    return '网络连接中断。手机锁屏、切换 Wi-Fi/流量或切后台太久都会导致断开；请回到页面检查网络后重试';
  return m+'（若反复出现请确认服务是否正常）';
}
async function send(){
  if(busy)return;
  if(attachList.some(a=>a.uploading)){toast('附件仍在上传中，请稍候…');return}
  const mark=attachMarks();
  let q=inputBox.value.trim();
  if(!q&&!mark)return;
  if(mark)q=q?(mark+' '+q):mark;
  inputBox.value='';autoGrow();
  push({role:'user',text:q});
  busy=true;sendBtn.disabled=true;
  controller=new AbortController();
  ensureLiveMsg();
  const wantGeo=needsGeoLocation(q);
  let geoLine=null;
  if(wantGeo&&geoSupported()&&geoSecure()&&!geoFix){
    geoLine=addLiveToolLine('locate_ip');
    geoLine.dataset.label='获取精确定位';
    geoLine.querySelector('.a-txt').textContent='正在获取精确定位…';
  }
  const gf=await geoForSend(wantGeo);   // 位置相关问题会自动开启精确定位（最多等几秒）
  if(geoLine)settleLiveToolLine(geoLine,!!gf,gf?'精度约 ±'+Math.round(gf.acc||0)+' 米':'未取到，改用 IP 定位（城市级）');
  let answer='';
  let answeredModel='';
  let lastUsage=null;   // 本轮用量（done 事件带回：hit/miss/in/out/rounds）
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
      body:JSON.stringify({query:q,model:modelKey,geo:gf?{lat:gf.lat,lng:gf.lng,acc:gf.acc}:undefined}),
      signal:controller.signal
    });
    if(resp.status===401){
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      push({role:'error',text:'🔒 登录已过期，请重新登录'});
      showAuth('登录已过期，请重新登录');
      return;
    }
    if(!resp.ok){
      let data=null;try{data=await resp.json()}catch(e){}
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      push({role:'error',text:'请求失败：'+(data&&data.detail?data.detail:('HTTP '+resp.status))});
      return;
    }
    attachClear();   // 附件标记已随 query 送达，收起输入框上方的小框
    if(!resp.body){
      // 极少数不支持流读取的环境：按 JSON 解析整包
      let data=null;try{data=await resp.json()}catch(e){}
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      if(data&&typeof data.answer==='string'){
        const it={role:'assistant',text:data.answer};
        history.push(it);chatBox.appendChild(buildMsg(it));scrollKeep();
      }else{
        push({role:'error',text:'返回格式异常：'+JSON.stringify(data).slice(0,300)});
      }
      return;
    }
    // ---- SSE 流式读取 ----
    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='',streamEnded=false,completed=false;
    while(!streamEnded){
      const r=await reader.read();
      streamEnded=r.done;
      buf+=dec.decode(r.value||new Uint8Array(),{stream:!streamEnded});
      let pos;
      while((pos=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,pos).trim();buf=buf.slice(pos+2);
        if(!raw.startsWith('data:'))continue;
        const payload=raw.slice(5).trim();
        if(!payload||payload==='[DONE]')continue;
        let ev=null;try{ev=JSON.parse(payload)}catch(e){continue}
        if(ev.type==='answer'&&ev.delta){
          answer+=ev.delta;
          if(liveBubbleEl)liveAppend(ev.delta);
          scrollKeep();
        }else if(ev.type==='tool'&&ev.name){
          const name=ev.name;
          if(ev.status==='start'){
            // 连续的**同名**调用合并成一行（「搜索 ×4」）；换了工具名就另起一行
            if(curRun&&curRun.name===name){
              bumpToolRun(curRun,ev.note||'');
            }else{
              sealToolRun(curRun,'done');   // 上一组先收尾
              liveBreakSegment();           // 结束当前文本段，把工具行插在这段文字正下方
              curRun={name:name,el:addLiveToolLine(name),count:0,notes:[],closed:false};
              liveActLines[name]=curRun.el;
              bumpToolRun(curRun,ev.note||'');
            }
          }else if(curRun&&curRun.name===name){
            sealToolRun(curRun,ev.status==='ok'?'done':'fail');
          }else{
            settleLiveToolLine(liveActLines[name],ev.status==='ok',ev.note||'');
          }
          scrollKeep();
        }else if(ev.type==='done'){
          if(ev.answer!==undefined)answer=ev.answer;
          if(ev.model_key)answeredModel=modelLabel(ev.model_key);
          if(ev.usage&&(ev.usage.in||ev.usage.out))lastUsage=ev.usage;
          completed=true;
        }else if(ev.type==='error'){
          throw new Error(ev.message||'服务端流式错误');
        }
      }
      if(completed)break;
    }
    // 结束：用最终全文渲染替换直播气泡
    const it={role:'assistant',text:(answer&&answer.trim())?answer:'（无回答）',
              model:answeredModel||modelLabel(modelKey),usage:lastUsage};
    finishLiveStream(it);
  }catch(err){
    const el=liveMsgEl;el&&el.remove();liveCleanup();
    if(err&&err.name==='AbortError'){
      push({role:'assistant',text:'⚠️ 已停止生成。'});
    }else if(answer&&answer.trim()){
      // 生成中途断线：先保留已生成的部分，再向服务端确认——它已把半截存下并标记「未完成」
      push({role:'assistant',text:answer.trim()+'\n\n⚠️ 网络中断，以上是已生成的部分。'});
      confirmInterrupted();   // 确认到后重绘，气泡下会出现「继续」按钮
    }else{
      push({role:'error',text:'请求出错：'+netErrMsg(err)});
    }
  }finally{
    busy=false;sendBtn.disabled=false;controller=null;
    inputBox.focus();
  }
}
sendBtn.onclick=send;

/* ================= 输入框 ================= */
function autoGrow(){
  inputBox.style.height='auto';
  inputBox.style.height=Math.min(inputBox.scrollHeight,160)+'px';
}
inputBox.addEventListener('input',autoGrow);
inputBox.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
});

/* ================= 顶栏按钮 ================= */
$('#themeBtn').onclick=()=>{
  const r=document.documentElement;
  const next=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  syncThemeIcon();
};
function syncThemeIcon(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.querySelector('.ic-moon').style.display=dark?'none':'';
  document.querySelector('.ic-sun').style.display=dark?'':'none';
}
$('#clearBtn').onclick=async()=>{
  if(!history.length)return;
  if(!confirm('确定清空当前对话吗？（只清你自己的历史）'))return;
  try{await fetch('/api/history',{method:'DELETE',headers:{'Authorization':'Bearer '+authToken}})}catch(e){}
  history=[];renderAll();inputBox.focus();
};

/* ================= 鉴权 ================= */
function showAuth(msg){
  if(msg&&authErr)authErr.textContent=msg;
  authOverlay.hidden=false;
  setTimeout(()=>{if(authUser)authUser.focus()},50);
}
function hideAuth(){

// 登录/注册二合一：用户名已存在→登录；不存在→带邀请码即注册
async function doAuth(){
  const username=authUser?(authUser.value||'').trim():'';
  const pwd=authPwd?(authPwd.value||''):'';
  const invite=authInvite?(authInvite.value||'').trim():'';
  if(!username||!pwd||authLoginBtn.disabled)return;
  authLoginBtn.disabled=true;
  if(authErr)authErr.textContent='';
  try{
    const r=await fetch('/api/auth',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password:pwd,invite})
    });
    let d=null;try{d=await r.json()}catch(e){}
    if(r.ok&&d&&d.token){
      authToken=d.token;
      me.name=d.username||username;
      try{localStorage.setItem(TOKEN_KEY,authToken)}catch(e){}
      if(authUser)authUser.value='';
      if(authPwd)authPwd.value='';
      if(authInvite)authInvite.value='';
      hideAuth();
      await refreshMe();           // 【必须】/api/auth 不返回 is_admin，补齐后才能显示云服务器入口
      await loadServerHistory();   // 拉取该用户自己的历史
      await loadModels();          // 拉取可选模型清单
      localStatus();wsStart();await restoreLocalHandle();geoRender();
      loadWhatsNew(true);               // 有未读更新 → 登录后自动弹一次
      if(geoEnabled)requestGeo(true);   // 上次开过 → 静默刷新一次坐标
      inputBox.focus();
      return;
    }
    const detail=(d&&d.detail)?d.detail:('登录失败（HTTP '+r.status+'）');
    if(authErr)authErr.textContent=detail;
    const card=authOverlay.querySelector('.auth-card');
    if(card){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}
  }catch(err){
    if(authErr)authErr.textContent='无法连接服务器：'+err.message;
  }finally{
    authLoginBtn.disabled=false;
  }
}
async function doLogout(){

/* IndexedDB: 每用户最近 3 个授权目录句柄列表(本浏览器本地) */
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('hj_mcp_local',2);r.onupgradeneeded=e=>{const db=r.result;if(!db.objectStoreNames.contains('dirs'))db.createObjectStore('dirs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbReq(db,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction('dirs',mode).objectStore('dirs');const q=fn(tx);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbGet(k){const db=await idbOpen();try{return await idbReq(db,'readonly',s=>s.get(k))}finally{db.close()}}
async function idbSet(k,v){const db=await idbOpen();try{await idbReq(db,'readwrite',s=>s.put(v,k))}finally{db.close()}}
async function idbDel(k){const db=await idbOpen();try{await idbReq(db,'readwrite',s=>s.delete(k))}finally{db.close()}}

/* 工作空间记录: {list:[{name,handle},...]} 最多3条, 新的在前 */
const MAX_WS=3;
function wsKey(){return 'wslist_'+me.name}
async function loadWsList(){
  if(!me.name)return[];
  try{
    const v=await idbGet(wsKey());
    // 兼容旧版: 旧结构是单个 handle 直接存 me.name 下
    if(!v||!Array.isArray(v.list)){
      const old=await idbGet(me.name);
      if(old&&old.name){const nv={list:[{name:old.name,handle:old}]};await idbSet(wsKey(),nv);return nv.list}
      return v&&v.list?v.list:[];
    }
    return v.list;
  }catch(e){return[]}
}
async function saveWsList(list){
  if(!me.name)return;
  try{await idbSet(wsKey(),{list})}catch(e){}
}
// 挑选/写入目录句柄后, 把该目录排到最近列表最前(去重, 最多保留 MAX_WS 个)
async function rememberWs(h){
  const list=await loadWsList();
  const next=[{name:h.name,handle:h}].concat(list.filter(x=>x&&x.name!==h.name)).slice(0,MAX_WS);
  await saveWsList(next);
  return next;
}
async function forgetWs(name){
  const list=await loadWsList();
  await saveWsList(list.filter(x=>x&&x.name!==name));
}

/* 授权目录内的文件操作(由后端经 WS 下达, 结果回传) */
async function fsopExec(op,path,content){
  if(!localHandle)return{ok:false,error:'尚未选择工作空间。请点击输入框上方的“选择工作空间”按钮授权本机文件夹后重试。'};
  const parts=(path||'').split('/').filter(Boolean);
  try{
    if(op==='list'){
      let d=localHandle;
      for(const p of parts)d=await d.getDirectoryHandle(p,{create:false});
      const items=[];
      for await(const[n,hd]of d.entries())items.push({n,k:hd.kind==='directory'?'dir':'file'});
      items.sort((a,b)=>a.k===b.k?(a.n<b.n?-1:1):(a.k==='dir'?-1:1));
      const who=parts.join('/')||'(授权根目录)';
      if(!items.length)return{ok:true,data:'['+who+'] 为空目录'};
      return{ok:true,data:'['+who+'] 共 '+items.length+' 项\n'+items.map(x=>x.k==='dir'?x.n+'/':x.n).join('\n')};
    }
    if(op==='read'){
      if(!parts.length)return{ok:false,error:'read 需要指定文件名'};
      let d=localHandle;
      for(const p of parts.slice(0,-1))d=await d.getDirectoryHandle(p,{create:false});
      const fh=await d.getFileHandle(parts[parts.length-1],{create:false});
      const f=await fh.getFile();
      const cap=400000;
      const txt=f.size>cap?(await f.slice(0,cap).text())+'\n…(文件较大,仅截取前 '+cap+' 字符)':await f.text();
      return{ok:true,data:'[本机文件] '+f.name+' ('+f.size+' bytes)\n'+txt};
    }
    if(op==='write'){
      if(!parts.length)return{ok:false,error:'write 需要指定文件名'};
      const perm=await localHandle.queryPermission({mode:'readwrite'});
      if(perm==='prompt')return{ok:false,error:'浏览器要求重新确认写入权限：请点击输入框上方的“工作空间”按钮(会弹出允许框)后重试。'};
      if(perm==='denied')return{ok:false,error:'写入权限已被拒绝。请在地址栏左侧权限设置里允许该网站，或重新授权文件夹。'};
      let d=localHandle;
      for(const p of parts.slice(0,-1))d=await d.getDirectoryHandle(p,{create:true});
      const fh=await d.getFileHandle(parts[parts.length-1],{create:true});
      const w=await fh.createWritable();await w.write(content);await w.close();
      return{ok:true,data:'已写入本机文件 '+fh.name+' ('+content.length+' 字符)'};
    }
    return{ok:false,error:'未知操作 '+op};
  }catch(e){return{ok:false,error:'本机文件操作失败：'+e.message}}
}

/* WebSocket 通道: 后端把 user_filesystem 调用推到浏览器执行 */
function wsStart(){
  if(!authToken)return;
  if(ws){try{ws.close()}catch(e){}}
  const proto=location.protocol==='https:'?'wss://':'ws://';
  let closed=false;
  const sk=new WebSocket(proto+location.host+'/ws?token='+encodeURIComponent(authToken));
  sk.onmessage=async(e)=>{
    let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(!m||m.type!=='fsop')return;
    const r=await fsopExec(m.op,m.path,m.content);
    try{sk.send(JSON.stringify({type:'fsop_result',id:m.id,ok:r.ok,data:r.ok?r.data:undefined,error:r.ok?undefined:r.error}))}catch(_){}
  };
  sk.onclose=()=>{if(closed)return;if(ws===sk)ws=null;if(authToken)setTimeout(wsStart,1500)};
  sk.onerror=()=>{try{sk.close()}catch(_){}};
  ws=sk;
}
function wsStop(){
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}}
  ws=null;
}

/* =============== 文件上传(+ 按钮)：图片/文档/表格/压缩包… 任意类型 =============== */
/* 桌面: 点 + 弹文件对话框 / 拖拽到输入框 / Ctrl+V 粘贴；移动端: 点 + 由系统弹层选(拍照、相册、文件) */
const MAX_UP=8*1024*1024;
const IMG_RE=/\.(png|jpe?g|gif|webp|bmp|svg|ico|heic|heif|avif|tiff?)$/i;
const plusBtn=$('#plusBtn'), fileInput=$('#fileInput'), composerEl=$('.composer');
const IS_MOBILE=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||/Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent||'');
// 生成引用标记：图片=[图片: 路径]，其他=[文件: 路径]（发送时随 query 带上，AI 据此读取文件）
function attachMark(path,name,type){
  const isImg=(type&&type.indexOf('image/')===0)||IMG_RE.test(name||path||'');
  return (isImg?'[图片: ':'[文件: ')+path+']';
}
/* ===== 附件条：上传中的小框挂在输入框上方（缩略图 + 进度 + 叉），不再把文本塞进输入框 ===== */
const attachBar=$('#attachBar');
const attachList=[];   // {id,name,type,path,mark,pct,uploading,fail,url,xhr}
let attachSeq=0;
function attachRender(){
  if(!attachBar)return;
  attachBar.hidden=!attachList.length;
  attachBar.innerHTML='';
  attachList.forEach(a=>{
    const chip=document.createElement('div');
    chip.className='attach-chip'+(a.fail?' fail':(a.uploading?' uploading':' done'));
    chip.title=a.name;
    if(a.url){const im=document.createElement('img');im.src=a.url;im.alt='';chip.appendChild(im)}
    else{
      const ext=(String(a.name).split('.').pop()||'').toUpperCase().slice(0,4);
      const d=document.createElement('div');d.className='ico';d.textContent=ext||'FILE';chip.appendChild(d);
    }
    const pg=document.createElement('div');pg.className='pg';
    pg.textContent=a.fail?'失败':((a.pct||0)+'%');
    chip.appendChild(pg);
    const bar=document.createElement('div');bar.className='bar';
    bar.style.width=(a.fail?100:(a.pct||0))+'%';
    chip.appendChild(bar);
    const x=document.createElement('button');
    x.type='button';x.className='x';x.title='移除';x.textContent='×';
    x.onclick=e=>{e.stopPropagation();attachRemove(a.id)};
    chip.appendChild(x);
    attachBar.appendChild(chip);
  });
}
function attachRemove(id){
  const i=attachList.findIndex(a=>a.id===id);
  if(i<0)return;
  const a=attachList[i];
  try{if(a.xhr&&a.uploading)a.xhr.abort()}catch(e){}
  if(a.url)try{URL.revokeObjectURL(a.url)}catch(e){}
  attachList.splice(i,1);attachRender();
}
function attachClear(){
  attachList.forEach(a=>{if(a.url)try{URL.revokeObjectURL(a.url)}catch(e){}});
  attachList.length=0;attachRender();
}
function attachAdd(file){
  const a={id:++attachSeq,name:file.name||('file_'+Date.now()),type:file.type||'',path:'',mark:'',pct:0,uploading:true,fail:false,url:'',xhr:null};
  if(a.type.indexOf('image/')===0||IMG_RE.test(a.name)){
    try{a.url=URL.createObjectURL(file)}catch(e){}
  }
  attachList.push(a);attachRender();
  return a;
}
/* 单文件上传：用 XHR 以便拿到真实进度 */
function attachUpload(a,file){
  return new Promise(resolve=>{
    const fd=new FormData();fd.append('file',file,a.name);
    let xhr;
    try{xhr=new XMLHttpRequest()}catch(e){a.uploading=false;a.fail=true;attachRender();return resolve(a)}
    a.xhr=xhr;
    xhr.open('POST','/api/uploads');
    xhr.setRequestHeader('Authorization','Bearer '+authToken);
    xhr.upload.onprogress=e=>{if(e.lengthComputable){a.pct=Math.min(99,Math.round(e.loaded*100/e.total));attachRender()}};
    xhr.onload=()=>{
      let d={};try{d=JSON.parse(xhr.responseText||'{}')}catch(e){}
      if(xhr.status>=200&&xhr.status<300&&d.path){
        a.path=d.path;a.name=d.name||a.name;a.pct=100;a.uploading=false;
        a.mark=attachMark(a.path,a.name,a.type);
      }else{
        a.fail=true;a.uploading=false;
        toast('上传失败：'+(d.detail||('HTTP '+xhr.status)));
      }
      attachRender();resolve(a);
    };
    xhr.onerror=()=>{a.fail=true;a.uploading=false;toast('上传失败：网络中断');attachRender();resolve(a)};
    xhr.onabort=()=>{a.uploading=false;attachRender();resolve(a)};
    xhr.send(fd);
  });
}
/* 统一上传入口：任意文件 → 服务器工作空间 _uploads/，以小框形式挂在输入框上方 */
async function uploadFiles(files){
  const list=[...(files||[])].filter(Boolean);
  if(!list.length)return [];
  if(plusBtn)plusBtn.classList.add('busy');
  const jobs=[];
  try{
    for(const f of list){
      const fname=f.name||('file_'+Date.now());
      if(f.size>MAX_UP){toast('「'+fname+'」超过 8MB，已跳过');continue}
      const a=attachAdd(f);
      jobs.push(attachUpload(a,f));
    }
  }finally{
    if(plusBtn)plusBtn.classList.remove('busy');
    if(fileInput)fileInput.value='';
    if(localUp)localUp.value='';
  }
  if(jobs.length)await Promise.allSettled(jobs);
  const ok=attachList.filter(a=>a.path);
  if(ok.length){inputBox.focus();toast('已上传 '+ok.length+' 个文件，可补充说明后发送')}
  return ok;
}
/* 把附件引用标记拼进发送内容：界面上不再显示这些文字，但后端/AI 需要它们 */
function attachMarks(){return attachList.filter(a=>a.path&&a.mark).map(a=>a.mark).join(' ')}
if(plusBtn)plusBtn.onclick=()=>{fileInput&&fileInput.click()};
if(fileInput)fileInput.onchange=e=>{uploadFiles(e.target.files)};
if(composerEl){
  composerEl.addEventListener('dragover',e=>{e.preventDefault();composerEl.classList.add('dragover')});
  composerEl.addEventListener('dragleave',()=>composerEl.classList.remove('dragover'));
  composerEl.addEventListener('drop',e=>{
    const fs=e.dataTransfer&&e.dataTransfer.files;
    if(fs&&fs.length){e.preventDefault();composerEl.classList.remove('dragover');uploadFiles(fs)}
  });
}
document.addEventListener('paste',e=>{
  const fs=e.clipboardData&&e.clipboardData.files;
  if(fs&&fs.length)uploadFiles(fs);
});

        '<span class="wi-ico">'+(isCur?'📁':'🗂')+'</span>'+
        '<span class="wi-name">'+esc(it.name)+'</span>'+
        (isCur?'<span class="wi-now">当前</span>':'')+
        '<span class="wi-del" title="从列表移除">✕</span>'+
      '</button>';
    });
  }
  if(me.isAdmin){
    const srvName=me.serverRoot||'/';
    html+='<div class="ws-sep"></div>';
    html+='<div class="ws-hd"><span>云服务器（管理员）</span></div>';
    html+='<button class="ws-item" id="wsServerItem">'+
      '<span class="wi-ico">☁️</span>'+
      '<span class="wi-name">云服务器 · 整台服务器</span>'+
      (wsMode==='server'?'<span class="wi-now">当前</span>':'<span class="wi-tag">'+esc(srvName)+'</span>')+
    '</button>';
  }
  if(localSupported){
    html+='<div class="ws-sep"></div>';
    html+='<button class="ws-add" id="wsAddNew">＋ 新建工作空间</button>';
  }
  menu.innerHTML=html;
  // 先显示菜单：后面的事件绑定即使出错，也不该让菜单变成“点不出来”
  menu.hidden=false;
  try{
    menu.querySelectorAll('.ws-item').forEach(btn=>{
      const nm=btn.dataset.name;
      if(!nm)return;   // 云服务器项没有 data-name，其事件在下方单独绑定
      const del=btn.querySelector('.wi-del');
      if(del)del.onclick=async ev=>{   // 必须判空：非列表项不一定有删除按钮
        ev.stopPropagation();
        await forgetWs(nm);
        if(localHandle&&localHandle.name===nm)localHandle=null;
        openWsMenu();localStatus();
      };
      btn.onclick=async()=>{
        const name=btn.dataset.name;
        if(localHandle&&localHandle.name===name){closeWsMenu();return}
        await switchWsTo(name);
      };
    });
    const srv=menu.querySelector('#wsServerItem');
    if(srv)srv.onclick=async()=>{closeWsMenu();await switchToServerWs();};
    const add=menu.querySelector('#wsAddNew');
    if(add)add.onclick=()=>{closeWsMenu();pickLocalDir()};
  }catch(err){
    console.warn('工作空间菜单事件绑定失败',err);
  }
}
function closeWsMenu(){
  const menu=$('#wsMenu');
  if(menu)menu.hidden=true;
  if(localBtn)localBtn.classList.remove('open');
}
document.addEventListener('click',e=>{
  const menu=$('#wsMenu'),bar=$('#wsBar');
  if(menu&&!menu.hidden&&bar&&!bar.contains(e.target))closeWsMenu();
