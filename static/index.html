<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MCP Agent · 全能助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<script>
// 主题：localStorage 优先，其次跟随系统；提前执行防止闪烁
(function(){
  try{
    var t = localStorage.getItem('mcp-theme');
    if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
:root{
  --radius:16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Courier New", monospace;
}
/* ============ 深色主题 ============ */
html[data-theme="dark"]{
  --bg0:#07090f; --bg1:#0d1017;
  --panel:rgba(255,255,255,.042);
  --panel-solid:#151926;
  --border:rgba(255,255,255,.085);
  --border-strong:rgba(255,255,255,.16);
  --text:#e9ebf3; --text2:#99a1b3; --text3:#5f677e;
  --accent1:#4c7dff; --accent2:#9a6bff;
  --user-grad:linear-gradient(135deg,#3d6dff,#8b5cf6);
  --bubble:rgba(255,255,255,.045);
  --code-bg:#0a0d14;
  --code-head:#0d1119;
  --err-bg:rgba(255,80,110,.09); --err-bd:rgba(255,90,120,.45); --err-tx:#ff8fa3;
  --glow:rgba(76,125,255,.16);
  --shadow:0 12px 34px rgba(0,0,0,.38);
  color-scheme:dark;
}
/* ============ 浅色主题 ============ */
html[data-theme="light"]{
  --bg0:#eef1f8; --bg1:#f6f7fc;
  --panel:#ffffff;
  --panel-solid:#ffffff;
  --border:#e2e6f0;
  --border-strong:#cdd4e4;
  --text:#191e2c; --text2:#5b6474; --text3:#8b93a5;
  --accent1:#2f6bff; --accent2:#7c4dff;
  --user-grad:linear-gradient(135deg,#2f6bff,#7c4dff);
  --bubble:#ffffff;
  --code-bg:#f3f5fb;
  --code-head:#eceff8;
  --err-bg:#fff0f2; --err-bd:#ffc2cc; --err-tx:#d33855;
  --glow:rgba(47,107,255,.10);
  --shadow:0 12px 30px rgba(30,42,80,.10);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg1);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* 背景氛围光斑 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(600px 400px at 12% -10%, var(--glow), transparent 60%),
    radial-gradient(700px 500px at 105% 8%, var(--glow), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, var(--glow), transparent 60%);
}
.app{
  position:relative;z-index:1;height:100dvh;max-width:880px;margin:0 auto;
  display:flex;flex-direction:column;padding:0 18px;
}
/* ============ 顶栏 ============ */
header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 2px 12px;flex:none;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(76,125,255,.35);
}
.logo svg{width:20px;height:20px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--text2);margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tool-chip{
  font-size:11px;color:var(--text2);padding:2px 8px;border-radius:99px;
  background:var(--panel);border:1px solid var(--border);white-space:nowrap;
}
.hbtns{display:flex;gap:6px;flex:none}
.hbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel);color:var(--text2);cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:.18s;
}
.hbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--panel-solid)}
.hbtn svg{width:17px;height:17px}
/* 当前登录用户徽标 */
.user-badge{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
  border-radius:999px;border:1px solid var(--border);background:var(--panel);
  font-size:12.5px;color:var(--text2);max-width:150px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.user-badge::before{content:"👤";font-size:12px;flex:none}
.user-badge[hidden]{display:none}
@media (max-width:600px){.user-badge{max-width:92px;padding:0 10px;font-size:11.5px;height:31px}}
/* ============ 消息区 ============ */
/* 隐藏原生滚动条（长度由浏览器控制，无法自定义），改用自绘"米粒"指示条 */
#chatBox{
  flex:1;overflow-y:auto;padding:20px 10px 12px 2px;scroll-behavior:smooth;
  scrollbar-width:none; /* Firefox 隐藏 */
}
#chatBox::-webkit-scrollbar{display:none}
/* 自绘滚动指示条：固定高度的小短条，滚动时出现，停止后淡出 */
.chat-scroll-ind{
  position:absolute;right:4px;top:80px;width:4px;height:20px;border-radius:4px;
  background:var(--text3);opacity:0;transition:opacity .4s;pointer-events:none;z-index:5;
}
.chat-scroll-ind.show{opacity:.75}
.msg{display:flex;gap:11px;margin-bottom:22px;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  width:32px;height:32px;flex:none;border-radius:10px;margin-top:2px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(76,125,255,.3);
}
.avatar svg{width:15px;height:15px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg.user .col{align-items:flex-end}
.time{font-size:11px;color:var(--text3);margin:0 4px 5px}
.bubble{
  max-width:100%;padding:12px 15px;border-radius:var(--radius);
  line-height:1.75;font-size:14.5px;word-break:break-word;overflow-wrap:break-word;
}
.bot .bubble{
  background:var(--bubble);border:1px solid var(--border);
  border-top-left-radius:5px;width:100%;
  box-shadow:var(--shadow);
}
.user .bubble{
  background:var(--user-grad);color:#fff;
  border-top-right-radius:5px;
  box-shadow:0 8px 20px rgba(76,125,255,.25);
  white-space:pre-wrap;
}
/* ---------- 气泡内 Markdown 排版 ---------- */
.bubble p{margin:0 0 10px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{
  margin:16px 0 8px;line-height:1.4;font-weight:700;
}
.bubble h1{font-size:19px}.bubble h2{font-size:17px}
.bubble h3{font-size:15.5px}.bubble h4{font-size:14.5px}
.bubble ul,.bubble ol{margin:4px 0 10px;padding-left:22px}
.bubble li{margin:3px 0}
.bubble a{color:var(--accent1);text-decoration:none;border-bottom:1px dashed var(--border-strong)}
.bubble a:hover{opacity:.85}
.bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.bubble blockquote{
  margin:10px 0;padding:4px 14px;border-left:3px solid var(--accent1);
  background:var(--panel);border-radius:0 8px 8px 0;color:var(--text2);
}
.bubble code{
  font-family:var(--mono);font-size:12.8px;background:var(--code-bg);
  border:1px solid var(--border);padding:1.5px 6px;border-radius:6px;
}
.bubble pre{
  margin:10px 0;padding:12px 14px;border-radius:12px;overflow:auto;
  background:var(--code-bg);border:1px solid var(--border);
}
.bubble pre code{background:none;border:none;padding:0;font-size:12.8px;line-height:1.6;display:block}
.bubble pre::-webkit-scrollbar{height:7px}
.bubble pre::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
/* ---------- 错误气泡 ---------- */
.bubble.err{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-tx)}
/* ---------- 思考动画 ---------- */
.typing{display:flex;align-items:center;gap:10px}
.dots{display:inline-flex;gap:4px;padding:2px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.stop-btn{
  margin-left:auto;flex:none;font-size:12px;color:var(--text2);cursor:pointer;
  border:1px solid var(--border);background:var(--panel);border-radius:8px;
  padding:3px 9px;transition:.15s;display:flex;align-items:center;gap:4px;
}
.stop-btn:hover{color:var(--err-tx);border-color:var(--err-bd)}
/* ---------- 流式消息：头部行/停止按钮/工具徽章 ---------- */
.live-top{display:flex;align-items:center;width:100%;margin:0 0 2px}
.live-top .time{margin:0}
.stop-mini{
  margin-left:auto;flex:none;font-size:11px;color:var(--text2);cursor:pointer;
  border:1px solid var(--border);background:var(--panel);border-radius:8px;
  padding:2px 8px;transition:.15s;display:flex;align-items:center;gap:3px;
}
.stop-mini:hover{color:var(--err-tx);border-color:var(--err-bd)}
.bubble.live{color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.6}
/* 流式正文中穿插的工具动作行：紧跟所在段落，浅色小字 */
.live-act{
  display:flex;align-items:center;gap:8px;
  margin:10px 0 12px;padding:2px 0;
  font-size:12.4px;line-height:1.45;color:var(--text2);
  user-select:none;
}
.live-act .a-ico{
  flex:none;width:15px;height:15px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#fff;
}
.live-act.run .a-ico{background:var(--accent1);animation:a-pulse 1.1s ease-in-out infinite}
.live-act.done{opacity:.55}
.live-act.done .a-ico{background:#16a34a}
.live-act.fail{opacity:.7}
.live-act.fail .a-ico{background:var(--err-tx)}
.live-act .a-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes a-pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* ============ 欢迎页 ============ */
.welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px 6vh}
.welcome .wlogo{
  width:64px;height:64px;border-radius:20px;margin-bottom:20px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 40px rgba(76,125,255,.35);
}
.welcome .wlogo svg{width:30px;height:30px}
.welcome h2{font-size:22px;font-weight:700;margin-bottom:8px}
.welcome p{color:var(--text2);font-size:14px;max-width:460px;line-height:1.7}
.suggests{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;width:100%;max-width:640px;margin-top:30px;
}
.sugg{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:13px 15px;text-align:left;cursor:pointer;transition:.18s;color:var(--text);
  font-family:var(--font);font-size:13px;line-height:1.6;
}
.sugg:hover{
  border-color:var(--accent1);transform:translateY(-2px);
  box-shadow:0 10px 24px var(--glow);
}
.sugg b{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-bottom:3px}
.sugg span{color:var(--text2);font-size:12px}
/* ============ 输入区 ============ */
.composer-wrap{flex:none;padding:10px 0 calc(12px + env(safe-area-inset-bottom))}
.composer{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--panel-solid);border:1px solid var(--border-strong);
  border-radius:20px;padding:9px 9px 9px 16px;
  box-shadow:var(--shadow);
  transition:border-color .18s;
}
.composer:focus-within{border-color:var(--accent1);box-shadow:0 0 0 3px var(--glow),var(--shadow)}
#inputBox{
  flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--text);
  font-family:var(--font);font-size:15px;line-height:1.6;max-height:160px;padding:7px 0;
}
#inputBox::placeholder{color:var(--text3)}
#sendBtn{
  width:42px;height:42px;flex:none;border:none;border-radius:14px;cursor:pointer;
  background:var(--user-grad);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:.18s;box-shadow:0 6px 16px rgba(76,125,255,.3);
}
#sendBtn:hover{transform:translateY(-1px);filter:brightness(1.08)}
#sendBtn:active{transform:scale(.95)}
#sendBtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
#sendBtn svg{width:18px;height:18px}
.hint{text-align:center;font-size:11px;color:var(--text3);margin-top:8px}
/* ============ 移动端 ============ */
button{touch-action:manipulation} /* 移动端消除双击缩放延迟 */
@media (max-width:600px){
  .app{padding:0 10px}
  header{padding:10px 2px}
  .logo{width:32px;height:32px;border-radius:9px}
  .logo svg{width:16px;height:16px}
  .brand h1{font-size:15px}
  .tool-chip{display:none}
  .hbtn{width:31px;height:31px;border-radius:9px}
  .hbtn svg{width:15px;height:15px}
  #chatBox{padding:14px 6px 10px 0} /* 移动端系统滚动条贴边，无需留白 */
  .msg{gap:8px;margin-bottom:16px}
  .avatar{width:27px;height:27px;border-radius:8px}
  .avatar svg{width:13px;height:13px}
  .time{font-size:10px}
  .bubble{font-size:14px;padding:10px 13px;line-height:1.7}
  .bubble h1{font-size:17px}.bubble h2{font-size:15.5px}
  .bubble pre{padding:10px 12px;border-radius:10px}
  .bubble pre code{font-size:12px}
  .welcome{padding:0 4px 3vh}
  .welcome .wlogo{width:52px;height:52px;border-radius:15px;margin-bottom:14px}
  .welcome .wlogo svg{width:24px;height:24px}
  .welcome h2{font-size:19px}
  .welcome p{font-size:13px}
  .suggests{gap:8px;margin-top:20px;grid-template-columns:1fr 1fr}
  .sugg{padding:11px 12px;border-radius:12px}
  .sugg b{font-size:12.5px}
  .sugg span{font-size:11px}
  .composer{border-radius:16px;padding:7px 7px 7px 13px}
  #inputBox{font-size:16px} /* ≥16px 防 iOS 聚焦时页面自动放大 */
  #sendBtn{width:38px;height:38px;border-radius:12px}
  .hint{display:none}
  .auth-overlay{padding:14px}
  .auth-card{padding:28px 22px 22px}
}
/* 超窄屏：建议卡退化为单列 */
@media (max-width:380px){
  .suggests{grid-template-columns:1fr}
  .brand h1{font-size:14px}
}
/* ============ 登录层 ============ */
.auth-overlay{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--bg0) 78%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:20px;
}
.auth-overlay[hidden]{display:none}
.auth-card{
  width:min(390px,92vw);background:var(--panel-solid);border:1px solid var(--border-strong);
  border-radius:22px;box-shadow:var(--shadow);padding:36px 30px 26px;text-align:center;
  animation:pop .3s ease;
}
.auth-logo{
  width:56px;height:56px;margin:0 auto 18px;border-radius:17px;
  background:linear-gradient(135deg,#3d6dff,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(76,125,255,.35);
}
.auth-logo svg{width:27px;height:27px}
.auth-card h2{font-size:19px;margin-bottom:7px}
.auth-card .auth-sub{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.65}
.auth-input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border-strong);
  background:var(--bubble);color:var(--text);font-size:14.5px;outline:none;
  transition:.18s;margin-bottom:6px;
}
.auth-input::placeholder{color:var(--text3)}
.auth-input:focus{border-color:var(--accent1);box-shadow:0 0 0 3px var(--glow)}
.auth-btn{
  width:100%;padding:12px;border:none;border-radius:12px;cursor:pointer;
  background:var(--user-grad);color:#fff;font-size:15px;font-weight:600;letter-spacing:2px;
  transition:.18s;margin-top:14px;
}
.auth-btn:hover{opacity:.92;transform:translateY(-1px)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.auth-err{min-height:18px;font-size:12.5px;color:var(--err-tx);margin:10px 0 0;line-height:1.5}
.auth-tip{font-size:11px;color:var(--text3);margin-top:16px;line-height:1.6}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.shake{animation:shake .5s ease}
</style>
</head>
<body>
<!-- 登录层 -->
<div id="authOverlay" class="auth-overlay" hidden>
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z" fill="#fff"/></svg>
    </div>
    <h2>MCP Agent</h2>
    <p class="auth-sub">此服务包含文件读写与终端执行能力<br>首次使用请填写邀请码完成注册</p>
    <input id="authUser" class="auth-input" type="text" placeholder="用户名（2-24 位中文/字母/数字）" autocomplete="username">
    <input id="authPwd" class="auth-input" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <input id="authInvite" class="auth-input" type="text" placeholder="邀请码（新用户注册时填写）" autocomplete="off">
    <button id="authLoginBtn" class="auth-btn">登 录 / 注 册</button>
    <p id="authErr" class="auth-err"></p>
    <p class="auth-tip">已有账号直接登录、无需邀请码<br>个人文件空间与历史消息相互隔离</p>
  </div>
</div>

<div class="app">
  <!-- 顶栏 -->
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z" fill="#fff"/></svg>
      </div>
      <div>
        <h1>MCP Agent</h1>
        <div class="tools">
          <span class="tool-chip">🗺️ 地图</span>
          <span class="tool-chip">🔍 搜索</span>
          <span class="tool-chip">📁 文件</span>
          <span class="tool-chip">💻 终端</span>
        </div>
      </div>
    </div>
    <div class="hbtns">
      <span id="userBadge" class="user-badge" hidden></span>
      <button class="hbtn" id="clearBtn" title="清空对话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/></svg>
      </button>
      <button class="hbtn" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ic-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ic-sun" style="display:none"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      <button class="hbtn" id="logoutBtn" title="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- 消息区 -->
  <main id="chatBox"></main>
  <div id="scrollInd" class="chat-scroll-ind"></div>

  <!-- 输入区 -->
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="inputBox" rows="1" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn" title="发送">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5a1 1 0 0 0 0-1.8L3.4 3.6a.9.9 0 0 0-1.2 1l2 6.7a1 1 0 0 0 .8.7l9 .6-9 .6a1 1 0 0 0-.8.7l-2 6.7a.9.9 0 0 0 1.2 1.1z"/></svg>
      </button>
    </div>
    <p class="hint">AI 生成内容仅供参考，请核查重要信息</p>
  </div>
</div>

<script>
/* ================= 工具函数 ================= */
const $ = s => document.querySelector(s);
const chatBox = $('#chatBox'), inputBox = $('#inputBox'), sendBtn = $('#sendBtn');
const THEME_KEY = 'mcp-theme';
const TOKEN_KEY = 'mcp-auth-token';
let authToken='', me={name:''};
try{authToken=localStorage.getItem(TOKEN_KEY)||''}catch(e){}
const authOverlay=$('#authOverlay'), authUser=$('#authUser'), authPwd=$('#authPwd'),
      authInvite=$('#authInvite'), authErr=$('#authErr'), authLoginBtn=$('#authLoginBtn');
const userBadge=$('#userBadge');
function updateUserBadge(){
  if(!userBadge)return;
  if(me&&me.name){userBadge.textContent=me.name;userBadge.hidden=false}
  else userBadge.hidden=true;
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

/* ================= 极简 Markdown 渲染 ================= */
function mdInline(s){
  const toks=[];
  // 行内代码保护
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>{toks.push('<code>'+c+'</code>');return '\u0000T'+(toks.length-1)+'\u0000'});
  // 链接
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 删除线
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  // 粗体
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // 斜体
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/__([^_]+)__/g,'<em>$1</em>');
  // 还原代码 token
  s=s.replace(/\u0000T(\d+)\u0000/g,(m,i)=>toks[+i]);
  return s;
}
function renderMarkdown(src){
  src=esc(src);
  const blocks=[];
  src=src.replace(/```([\w+#.-]*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push('<pre><code class="lang-'+lang+'">'+code.replace(/\n$/,'')+'</code></pre>');
    return '\u0000B'+(blocks.length-1)+'\u0000';
  });
  const lines=src.split('\n');
  let out='', para=[], i=0;
  const flush=()=>{if(para.length){out+='<p>'+mdInline(para.join(' '))+'</p>';para=[]}};
  while(i<lines.length){
    const line=lines[i];
    if(line.trim()===''){flush();i++;continue}
    // 代码块
    const cb=line.match(/^\u0000B(\d+)\u0000$/);
    if(cb){flush();out+=blocks[+cb[1]];i++;continue}
    // 分隔线
    if(/^([-*_])\1{2,}$/.test(line.trim())){flush();out+='<hr>';i++;continue}
    // 标题
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){flush();const n=h[1].length;out+='<h'+n+'>'+mdInline(h[2])+'</h'+n+'>';i++;continue}
    // 引用
    if(/^&gt;\s?/.test(line)){
      flush();const q=[];
      while(i<lines.length && /^&gt;\s?/.test(lines[i])){q.push(mdInline(lines[i].replace(/^&gt;\s?/,'')));i++}
      out+='<blockquote>'+q.join('<br>')+'</blockquote>';continue;
    }
    // 无序列表
    const ul=line.match(/^[-*+]\s+(.*)$/);
    if(ul){
      flush();const items=[mdInline(ul[1])];i++;
      while(i<lines.length){const m=lines[i].match(/^[-*+]\s+(.*)$/);if(m){items.push(mdInline(m[1]));i++}else break}
      out+='<ul>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';continue;
    }
    // 有序列表
    const ol=line.match(/^\d+[.、)]\s+(.*)$/);
    if(ol){
      flush();const items=[mdInline(ol[1])];i++;
      while(i<lines.length){const m=lines[i].match(/^\d+[.、)]\s+(.*)$/);if(m){items.push(mdInline(m[1]));i++}else break}
      out+='<ol>'+items.map(x=>'<li>'+x+'</li>').join('')+'</ol>';continue;
    }
    para.push(line);i++;
  }
  flush();
  return out.replace(/\u0000B(\d+)\u0000/g,(m,i)=>blocks[+i]);
}

/* ================= 消息管理 ================= */
let history=[];   // {role:'user'|'assistant'|'error'|'loading', text, ts?}
let busy=false, controller=null;

// 显示用的时刻：历史消息显示其真实时间，当场新消息显示当前时间
function fmtHM(ts){
  if(!ts)return now();
  const d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// 从服务端拉取“当前用户自己的”历史消息（按用户隔离）
async function loadServerHistory(){
  try{
    const r=await fetch('/api/history',{headers:{'Authorization':'Bearer '+authToken}});
    if(!r.ok){throw new Error('HTTP '+r.status)}
    const d=await r.json();
    if(d&&d.username)me.name=d.username;
    history=(d&&Array.isArray(d.messages)?d.messages:[])
      .filter(m=>m&&(m.role==='user'||m.role==='assistant'))
      .map(m=>({role:m.role,text:m.text,ts:m.ts}));
  }catch(e){
    history=[];
  }
  updateUserBadge();
  renderAll();
}

const STAR='<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z" fill="#fff"/></svg>';

function renderAll(){
  chatBox.innerHTML='';
  if(!history.length){showWelcome();return}
  history.forEach(item=>chatBox.appendChild(buildMsg(item)));
  scrollBottom();
}
function buildMsg(item){
  const wrap=document.createElement('div');
  if(item.role==='user'){
    wrap.className='msg user';
    wrap.innerHTML='<div class="col"><div class="time">'+fmtHM(item.ts)+'</div><div class="bubble">'+esc(item.text)+'</div></div>';
  }else{
    wrap.className='msg bot';
    if(item.role==='loading')wrap.id='loadingMsg'; // 标记 loading 气泡，便于回复后从 DOM 移除
    let body;
    if(item.role==='loading'){
      body='<div class="bubble"><div class="typing"><span class="dots"><i></i><i></i><i></i></span><span style="color:var(--text2);font-size:13px">正在思考并调用工具…</span>'+
           '<button class="stop-btn" id="stopBtn">⏹ 停止</button></div></div>';
    }else if(item.role==='error'){
      body='<div class="bubble err">'+esc(item.text)+'</div>';
    }else{
      body='<div class="bubble">'+renderMarkdown(item.text)+'</div>';
    }
    wrap.innerHTML='<div class="avatar">'+STAR+'</div><div class="col"><div class="time">'+fmtHM(item.ts)+'</div>'+body+'</div>';
  }
  return wrap;
}
function push(item){history.push(item);chatBox.appendChild(buildMsg(item));scrollBottom()}
function removeLoading(){
  // loading 仅是视觉态，不入 history；只删 DOM
  const el=document.getElementById('loadingMsg');
  if(el)el.remove();
}
function insertLoading(){
  chatBox.appendChild(buildMsg({role:'loading',text:''}));
  scrollBottom();
}
function scrollBottom(){chatBox.scrollTop=chatBox.scrollHeight}

/* ================= 自绘"米粒"滚动指示条 ================= */
const scrollInd=$('#scrollInd');
let indTimer=null;
function updateScrollInd(){
  if(!scrollInd)return;
  const maxScroll=chatBox.scrollHeight-chatBox.clientHeight;
  const rect=chatBox.getBoundingClientRect();
  const appRect=chatBox.parentElement.getBoundingClientRect();
  const trackH=rect.height;
  const th=Math.max(16,Math.min(32,trackH*0.08)); // 拇指高度：一粒米大小(16~32px)
  scrollInd.style.height=th+'px';
  const ratio=maxScroll>0?chatBox.scrollTop/maxScroll:0;
  scrollInd.style.top=(rect.top-appRect.top+ratio*(trackH-th))+'px';
  scrollInd.classList.add('show');
  clearTimeout(indTimer);
  indTimer=setTimeout(()=>scrollInd.classList.remove('show'),900);
}
chatBox.addEventListener('scroll',updateScrollInd,{passive:true});
window.addEventListener('resize',updateScrollInd);

/* ================= 欢迎页 ================= */
const SUGG=[
  {ico:'🗺️',t:'地图与周边',d:'帮我定位当前位置，并搜索附近的咖啡厅'},
  {ico:'🔍',t:'网页搜索',d:'搜索一下 MCP 协议最近有什么新进展'},
  {ico:'📁',t:'文件系统',d:'列出我的工作目录里有哪些文件'},
  {ico:'💻',t:'终端操作',d:'执行 pwd，告诉我当前在哪个目录'},
];
function showWelcome(){
  chatBox.innerHTML=
  '<div class="welcome">'+
    '<div class="wlogo">'+STAR+'</div>'+
    '<h2>你好，有什么可以帮你？</h2>'+
    '<p>我可以调用地图、网页搜索、文件系统与终端工具，替你查位置、搜资料、读写文件、执行命令。</p>'+
    '<div class="suggests">'+
      SUGG.map(s=>'<button class="sugg" data-q="'+esc(s.d)+'"><b>'+s.ico+' '+s.t+'</b><span>'+esc(s.d)+'</span></button>').join('')+
    '</div>'+
  '</div>';
  chatBox.querySelectorAll('.sugg').forEach(b=>{
    b.onclick=()=>{inputBox.value=b.dataset.q;autoGrow();inputBox.focus()};
  });
}

/* ================= 发送逻辑（SSE 流式） ================= */
let liveMsgEl=null,liveBubbleEl=null,liveTextNode=null;
let liveActLines={}; // 工具名 -> 最近一条动作行元素（完成时更新 / 同名重试收尾）
function liveCleanup(){
  liveMsgEl=null;liveBubbleEl=null;liveTextNode=null;liveActLines={};
}
function pinnedToBottom(){return chatBox.scrollHeight-chatBox.scrollTop-chatBox.clientHeight<160}
function scrollKeep(){if(pinnedToBottom())scrollBottom()}
function ensureLiveMsg(){
  liveMsgEl=document.createElement('div');liveMsgEl.className='msg bot';liveMsgEl.id='liveMsg';
  liveMsgEl.innerHTML='<div class="avatar">'+STAR+'</div><div class="col">'+
    '<div class="live-top"><div class="time">'+now()+'</div><button class="stop-mini" id="liveStop" title="停止生成">⏹ 停止</button></div>'+
    '<div class="bubble live" id="liveBubble"></div></div>';
  chatBox.appendChild(liveMsgEl);
  liveBubbleEl=liveMsgEl.querySelector('#liveBubble');
  // 占位也放进文本节点流，保证正文/工具行能与它正确衔接
  liveTextNode=document.createTextNode('⏳ 正在思考…');
  liveBubbleEl.appendChild(liveTextNode);
  liveMsgEl.querySelector('#liveStop').onclick=()=>controller&&controller.abort();
  scrollKeep();
}
// 工具名 -> 中文短名（未收录则显示原名）
const TOOL_LABEL={
  list_directory:'列出目录',read_text_file:'读取文件',write_file:'写入文件',
  edit_file:'修改文件',search_files:'搜索文件',get_file_info:'查看文件信息',
  directory_tree:'查看目录树',read_multiple_files:'批量读取文件',
  create_directory:'新建目录',move_file:'移动文件',copy_file:'复制文件',
  delete_file:'删除文件',run_command:'执行终端命令',
  terminal_session_create:'开启终端',web_search:'联网搜索',fetch_page:'抓取网页'
};
function toolLabel(name){
  const t=String(name||'');
  if(t.startsWith('amap_'))return '地图·'+t.slice(5);
  if(TOOL_LABEL[t])return TOOL_LABEL[t];
  return t;
}
// 追加一段流式正文（始终在"当前文本段"的文本节点上续写）
function liveAppend(s){
  if(!liveTextNode){
    liveTextNode=document.createTextNode(s);liveBubbleEl.appendChild(liveTextNode);
  }else if(liveTextNode.data==='⏳ 正在思考…'){
    liveTextNode.data=s; // 占位直接转正文
  }else{
    liveTextNode.appendData(s);
  }
}
// 结束当前文本段：之后的正文会从工具行下方另起一段
function liveBreakSegment(){
  if(liveTextNode&&liveTextNode.data==='⏳ 正在思考…'){liveTextNode.remove();liveTextNode=null;}
  liveTextNode=null;
}
// 在当前文本段正下方插入一条"正在执行"的工具行
function addLiveToolLine(name){
  const line=document.createElement('div');line.className='live-act run';
  line.innerHTML='<span class="a-ico"></span><span class="a-txt"></span>';
  liveBubbleEl.appendChild(line);
  const label=toolLabel(name);
  line.dataset.label=label;
  line.querySelector('.a-txt').textContent='正在执行 '+label+' …';
  return line;
}
// 工具行收尾：成功打勾变淡只留工具名，失败打叉带提示
function settleLiveToolLine(line,ok,note){
  if(!line)return;
  line.className='live-act '+(ok?'done':'fail');
  line.querySelector('.a-ico').textContent=ok?'✓':'✕';
  line.querySelector('.a-txt').textContent=ok?(line.dataset.label||''):('失败：'+(line.dataset.label||''));
  if(note)line.title=note;
}
function finishLiveStream(item){
  // 用正式渲染替换直播节点，并写入页面历史（服务端已完成持久化，无需本地保存）
  const fresh=buildMsg(item);
  if(liveMsgEl)liveMsgEl.replaceWith(fresh);
  liveCleanup();
  history.push(item);scrollKeep();
}
async function send(){
  const q=inputBox.value.trim();
  if(!q||busy)return;
  inputBox.value='';autoGrow();
  push({role:'user',text:q});
  busy=true;sendBtn.disabled=true;
  controller=new AbortController();
  ensureLiveMsg();
  let answer='';
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
      body:JSON.stringify({query:q}),
      signal:controller.signal
    });
    if(resp.status===401){
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      push({role:'error',text:'🔒 登录已过期，请重新登录'});
      showAuth('登录已过期，请重新登录');
      return;
    }
    if(!resp.ok){
      let data=null;try{data=await resp.json()}catch(e){}
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      push({role:'error',text:'请求失败：'+(data&&data.detail?data.detail:('HTTP '+resp.status))});
      return;
    }
    if(!resp.body){
      // 极少数不支持流读取的环境：按 JSON 解析整包
      let data=null;try{data=await resp.json()}catch(e){}
      const el=liveMsgEl;el&&el.remove();liveCleanup();
      if(data&&typeof data.answer==='string'){
        const it={role:'assistant',text:data.answer};
        history.push(it);chatBox.appendChild(buildMsg(it));scrollKeep();
      }else{
        push({role:'error',text:'返回格式异常：'+JSON.stringify(data).slice(0,300)});
      }
      return;
    }
    // ---- SSE 流式读取 ----
    const reader=resp.body.getReader();
    const dec=new TextDecoder();
    let buf='',streamEnded=false,completed=false;
    while(!streamEnded){
      const r=await reader.read();
      streamEnded=r.done;
      buf+=dec.decode(r.value||new Uint8Array(),{stream:!streamEnded});
      let pos;
      while((pos=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,pos).trim();buf=buf.slice(pos+2);
        if(!raw.startsWith('data:'))continue;
        const payload=raw.slice(5).trim();
        if(!payload||payload==='[DONE]')continue;
        let ev=null;try{ev=JSON.parse(payload)}catch(e){continue}
        if(ev.type==='answer'&&ev.delta){
          answer+=ev.delta;
          if(liveBubbleEl)liveAppend(ev.delta);
          scrollKeep();
        }else if(ev.type==='tool'&&ev.name){
          const name=ev.name;
          if(ev.status==='start'){
            // 结束当前文本段，把工具行插在这段文字正下方
            const prev=liveActLines[name];
            if(prev&&prev.className==='live-act')settleLiveToolLine(prev,true); // 同名重试：上一行先收尾
            liveBreakSegment();
            liveActLines[name]=addLiveToolLine(name);
          }else{
            settleLiveToolLine(liveActLines[name],ev.status==='ok',ev.note||'');
          }
          scrollKeep();
        }else if(ev.type==='done'){
          if(ev.answer!==undefined)answer=ev.answer;
          completed=true;
        }else if(ev.type==='error'){
          throw new Error(ev.message||'服务端流式错误');
        }
      }
      if(completed)break;
    }
    // 结束：用最终全文渲染替换直播气泡
    const it={role:'assistant',text:(answer&&answer.trim())?answer:'（无回答）'};
    finishLiveStream(it);
  }catch(err){
    const el=liveMsgEl;el&&el.remove();liveCleanup();
    if(err&&err.name==='AbortError'){
      push({role:'assistant',text:'⚠️ 已停止生成。'});
    }else{
      push({role:'error',text:'请求出错：'+(err&&err.message?err.message:'未知错误')+'（请确认服务已启动）'});
    }
  }finally{
    busy=false;sendBtn.disabled=false;controller=null;
    inputBox.focus();
  }
}
sendBtn.onclick=send;

/* ================= 输入框 ================= */
function autoGrow(){
  inputBox.style.height='auto';
  inputBox.style.height=Math.min(inputBox.scrollHeight,160)+'px';
}
inputBox.addEventListener('input',autoGrow);
inputBox.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
});

/* ================= 顶栏按钮 ================= */
$('#themeBtn').onclick=()=>{
  const r=document.documentElement;
  const next=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  syncThemeIcon();
};
function syncThemeIcon(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.querySelector('.ic-moon').style.display=dark?'none':'';
  document.querySelector('.ic-sun').style.display=dark?'':'none';
}
$('#clearBtn').onclick=async()=>{
  if(!history.length)return;
  if(!confirm('确定清空当前对话吗？（只清你自己的历史）'))return;
  try{await fetch('/api/history',{method:'DELETE',headers:{'Authorization':'Bearer '+authToken}})}catch(e){}
  history=[];renderAll();inputBox.focus();
};

/* ================= 鉴权 ================= */
function showAuth(msg){
  if(msg&&authErr)authErr.textContent=msg;
  authOverlay.hidden=false;
  setTimeout(()=>{if(authUser)authUser.focus()},50);
}
function hideAuth(){
  authOverlay.hidden=true;
  if(authErr)authErr.textContent='';
}
// 登录/注册二合一：用户名已存在→登录；不存在→带邀请码即注册
async function doAuth(){
  const username=authUser?(authUser.value||'').trim():'';
  const pwd=authPwd?(authPwd.value||''):'';
  const invite=authInvite?(authInvite.value||'').trim():'';
  if(!username||!pwd||authLoginBtn.disabled)return;
  authLoginBtn.disabled=true;
  if(authErr)authErr.textContent='';
  try{
    const r=await fetch('/api/auth',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password:pwd,invite})
    });
    let d=null;try{d=await r.json()}catch(e){}
    if(r.ok&&d&&d.token){
      authToken=d.token;
      me.name=d.username||username;
      try{localStorage.setItem(TOKEN_KEY,authToken)}catch(e){}
      if(authUser)authUser.value='';
      if(authPwd)authPwd.value='';
      if(authInvite)authInvite.value='';
      hideAuth();
      await loadServerHistory();   // 拉取该用户自己的历史
      inputBox.focus();
      return;
    }
    const detail=(d&&d.detail)?d.detail:('登录失败（HTTP '+r.status+'）');
    if(authErr)authErr.textContent=detail;
    const card=authOverlay.querySelector('.auth-card');
    if(card){card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}
  }catch(err){
    if(authErr)authErr.textContent='无法连接服务器：'+err.message;
  }finally{
    authLoginBtn.disabled=false;
  }
}
async function doLogout(){
  try{await fetch('/api/logout',{method:'POST',headers:{'Authorization':'Bearer '+authToken}})}catch(e){}
  authToken='';me={name:''};
  try{localStorage.removeItem(TOKEN_KEY)}catch(e){}
  history=[];renderAll();updateUserBadge();
  if(authPwd)authPwd.value='';
  if(authInvite)authInvite.value='';
  showAuth('已退出登录');
}
if(authLoginBtn)authLoginBtn.onclick=doAuth;
[authUser,authPwd,authInvite].forEach(el=>{
  if(el)el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doAuth()}});
});
const logoutBtn=$('#logoutBtn');
if(logoutBtn)logoutBtn.onclick=()=>{if(confirm('确定退出登录吗？'))doLogout()};

/* ================= 初始化 ================= */
syncThemeIcon();renderAll();updateUserBadge();
(async function initAuth(){
  if(!authToken){showAuth();return}
  try{
    const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+authToken}});
    if(r.ok){
      const d=await r.json();
      me.name=(d&&d.username)||'';
      hideAuth();
      await loadServerHistory();   // 历史按登录用户加载，互不可见
      inputBox.focus();
      return;
    }
  }catch(e){/* 网络错误走下方统一登出 */}
  authToken='';
  try{localStorage.removeItem(TOKEN_KEY)}catch(e){}
  showAuth('登录已过期，请重新登录');
})();
</script>
</body>
