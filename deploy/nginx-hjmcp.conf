# ---------------------------------------------------------------------------
# HJ MCP Agent —— HTTP(80) 跳转 + HTTPS(443) TLS 反代到本机 uvicorn
#
# 证书：Let's Encrypt 的 IP 地址证书（shortlived profile，约 6 天有效期）。
#   签发/续期在 GitHub Actions 上跑（服务器到 LE 的接口被定向阻断），
#   见 .github/workflows/renew-ip-cert.yml。
#
# 部署位置：/etc/nginx/sites-available/hjmcp  ->  sites-enabled/hjmcp
# 安装方法：
#   ssh admin@<服务器> "sudo tee /etc/nginx/sites-available/hjmcp > /dev/null" < deploy/nginx-hjmcp.conf
#   ssh admin@<服务器> "sudo nginx -t && sudo systemctl reload nginx"
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Let's Encrypt http-01 验证路径（续期时也要用，务必保留）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/hjmcp-ip.crt;
    ssl_certificate_key /etc/nginx/ssl/hjmcp-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_prefer_server_ciphers off;
    # 注意：故意不开 HSTS——IP 证书只有 6 天有效期，一旦续期失败，
    # HSTS 会让浏览器连"忽略警告继续访问"的机会都不给。

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket（/ws 文件桥）必须带 Upgrade 头，否则会挂
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用真实对端地址覆盖，避免客户端伪造 XFF 影响 IP 定位
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式回答：关闭缓冲、拉长超时
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
